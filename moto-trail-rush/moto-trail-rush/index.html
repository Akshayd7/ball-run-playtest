<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Moto Trail Rush</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#2b1a3a;font-family:'Trebuchet MS',Verdana,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
  #c{display:block;width:100%;height:100%}
  .hud{position:fixed;pointer-events:none;z-index:10}
  #topbar{top:10px;left:10px;display:flex;align-items:center;gap:10px}
  #score{background:rgba(30,16,46,.72);color:#fff;border-radius:16px;padding:8px 16px;font-size:26px;font-weight:900;min-width:86px;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.25)}
  #hearts{display:flex;gap:5px}
  .heart{width:22px;height:22px;border-radius:50%;background:#ff5d73;border:3px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.25)}
  .heart.off{background:#5a4668;border-color:#8d7a9e}
  #btns{top:10px;right:10px;display:flex;gap:8px;pointer-events:auto}
  .rbtn{width:46px;height:46px;border-radius:50%;background:rgba(30,16,46,.72);border:none;color:#fff;font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
  #jumpbtn{bottom:26px;right:22px;pointer-events:auto;width:104px;height:104px;border-radius:50%;background:linear-gradient(180deg,#ffd94d,#ff9d3c);border:5px solid #fff;color:#7a3c00;font-size:19px;font-weight:900;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.28)}
  #steer{bottom:26px;left:22px;pointer-events:auto;display:flex;gap:14px}
  .sbtn{width:84px;height:84px;border-radius:50%;background:rgba(30,16,46,.6);border:5px solid #fff;color:#fff;font-size:30px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.28)}
  .overlay{position:fixed;inset:0;background:rgba(24,10,38,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;color:#fff;text-align:center;padding:20px}
  .title{font-size:44px;font-weight:900;color:#ffd94d;text-shadow:0 4px 0 rgba(0,0,0,.35);margin-bottom:8px}
  .sub{font-size:17px;color:#e8d9ff;margin-bottom:18px;line-height:1.5}
  .bigbtn{pointer-events:auto;background:linear-gradient(180deg,#7de36b,#3fb950);border:none;border-radius:22px;color:#08310f;font-size:24px;font-weight:900;padding:16px 44px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.3)}
  #besttag{font-size:16px;color:#ffd94d;margin-top:14px;font-weight:700}
  .hidden{display:none!important}
  #gosc{font-size:52px;font-weight:900;color:#ff8a5c;margin-bottom:4px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="topbar"><div id="score">0</div><div id="hearts"></div></div>
<div class="hud" id="btns">
  <button class="rbtn" id="pausebtn" aria-label="Pause">| |</button>
  <button class="rbtn" id="mutebtn" aria-label="Mute">S</button>
</div>
<div class="hud" id="steer"><button class="sbtn" id="sleft">&#9664;</button><button class="sbtn" id="sright">&#9654;</button></div>
<button class="hud" id="jumpbtn">JUMP</button>
<div class="overlay" id="menu">
  <div class="title">Moto Trail Rush</div>
  <div class="sub">Ride the sunset trail. Grab sun orbs,<br>dodge rocks and logs. 3 hearts.<br><br>Steer: Arrow keys / A D / side buttons<br>Jump: Space / JUMP button</div>
  <button class="bigbtn" id="startbtn">START RIDE</button>
  <div id="besttag"></div>
</div>
<div class="overlay hidden" id="over">
  <div id="gosc">GAME OVER</div>
  <div class="sub" id="finalscore"></div>
  <button class="bigbtn" id="retrybtn">RIDE AGAIN</button>
  <div id="besttag2"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(function(){
"use strict";
var canvas=document.getElementById('c');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
var scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xf7a55c,60,190);
var camera=new THREE.PerspectiveCamera(62,1,0.1,400);
function resize(){var w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();

// toon gradient
var gdata=new Uint8Array([90,160,255]);
var gtex=new THREE.DataTexture(gdata,3,1,THREE.LuminanceFormat);
gtex.minFilter=gtex.magFilter=THREE.NearestFilter;gtex.generateMipmaps=false;gtex.needsUpdate=true;
function toon(c,e){return new THREE.MeshToonMaterial({color:c,gradientMap:gtex,emissive:e||0x000000});}

// sky dome (sunset gradient)
var skyGeo=new THREE.SphereGeometry(360,20,14);
var skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:{},vertexShader:"varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}",fragmentShader:"varying vec3 vP;void main(){float t=clamp(vP.y/300.+.22,0.,1.);vec3 top=vec3(.44,.23,.55);vec3 mid=vec3(.97,.55,.38);vec3 low=vec3(1.,.78,.45);vec3 c=mix(low,mix(mid,top,smoothstep(.45,1.,t)),smoothstep(0.,.5,t));gl_FragColor=vec4(c,1.);}"});
scene.add(new THREE.Mesh(skyGeo,skyMat));
// sun
var sun=new THREE.Mesh(new THREE.CircleGeometry(26,28),new THREE.MeshBasicMaterial({color:0xffe9a8,fog:false}));
sun.position.set(24,58,-330);scene.add(sun);

var hemi=new THREE.HemisphereLight(0xffd9b0,0x6b4d8f,0.62);scene.add(hemi);
var dl=new THREE.DirectionalLight(0xffc98a,0.65);dl.position.set(30,50,-40);dl.castShadow=true;
dl.shadow.mapSize.set(1024,1024);dl.shadow.camera.left=-30;dl.shadow.camera.right=30;dl.shadow.camera.top=40;dl.shadow.camera.bottom=-60;dl.shadow.camera.far=180;
scene.add(dl);scene.add(dl.target);

// ground
var ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500,1,1),toon(0x63b84f));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
var ground2=new THREE.Mesh(new THREE.PlaneGeometry(500,500,1,1),toon(0x63b84f));
ground2.rotation.x=-Math.PI/2;ground2.position.z=-500;ground2.receiveShadow=true;scene.add(ground2);
// trail ribbon
var trailMat=toon(0xcf9450);
function makeTrail(z){var t=new THREE.Mesh(new THREE.PlaneGeometry(8,500,1,1),trailMat);t.rotation.x=-Math.PI/2;t.position.set(0,0.02,z);t.receiveShadow=true;scene.add(t);return t;}
var trail1=makeTrail(-250+125),trail2=makeTrail(-500-250+125);

function rand(a,b){return a+Math.random()*(b-a);}
// scenery builders
function makeTree(){var g=new THREE.Group();var trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22,.3,1.6,6),toon(0x8a5a33));trunk.position.y=.8;trunk.castShadow=true;g.add(trunk);var c=new THREE.Mesh(new THREE.ConeGeometry(rand(1.1,1.7),rand(2.4,3.6),7),toon(Math.random()<.5?0x3fae5a:0x57c46b));c.position.y=2.6;c.castShadow=true;g.add(c);return g;}
function makeMesa(){var h=rand(7,16);var m=new THREE.Mesh(new THREE.CylinderGeometry(rand(2.5,4.5),rand(3.5,6),h,7),toon(Math.random()<.5?0xd98b4a:0xc97640));m.position.y=h/2;m.castShadow=true;return m;}
function makeBush(){var b=new THREE.Mesh(new THREE.SphereGeometry(rand(.5,.9),7,6),toon(0x4fb963));b.castShadow=true;return b;}
var scenery=[];
function spawnScenery(z){var side=Math.random()<.5?-1:1;var x=side*rand(7,40);var r=Math.random();var o;if(r<.55)o=makeTree();else if(r<.8)o=makeBush();else o=makeMesa();o.position.set(x,0,z);scene.add(o);scenery.push(o);}
for(var z=10;z>-480;z-=rand(5,11))spawnScenery(z);

// obstacles + orbs
function makeRock(){var r=new THREE.Mesh(new THREE.DodecahedronGeometry(rand(.7,1.15),0),toon(0x9b8aa8));r.castShadow=true;return r;}
function makeLog(){var g=new THREE.Group();var l=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,4.6,8),toon(0x9a6236));l.rotation.z=Math.PI/2;l.position.y=.42;l.castShadow=true;g.add(l);return g;}
function makeOrb(){var o=new THREE.Mesh(new THREE.SphereGeometry(.42,10,8),new THREE.MeshToonMaterial({color:0xffd94d,emissive:0xa87800}));o.castShadow=false;return o;}
var obstacles=[],orbs=[];
var LANES=[-3,0,3];
function spawnWave(z){
  var roll=Math.random();
  var nObs=(speed>17&&roll<.45)?2:(roll<.7?1:0);
  var used={};
  for(var i=0;i<nObs;i++){var li=Math.floor(Math.random()*3);if(used[li]){i--;continue;}used[li]=1;
    var ob=Math.random()<.55?makeRock():makeLog();ob.position.set(LANES[li],0,z);scene.add(ob);obstacles.push(ob);}
  if(Math.random()<.8){var li2=Math.floor(Math.random()*3);if(!used[li2]){var n=3+Math.floor(Math.random()*3);for(var k=0;k<n;k++){var orb=makeOrb();orb.position.set(LANES[li2],1.1,z-3-k*3.2);scene.add(orb);orbs.push(orb);}}}
}
var nextWave=-60;

// bike + rider (original cartoon build)
var bike=new THREE.Group();
var wheelG=new THREE.TorusGeometry(.55,.22,8,14);
var wmat=toon(0x3a3f4a);
var w1=new THREE.Mesh(wheelG,wmat);w1.position.set(0,.55,1.05);w1.castShadow=true;bike.add(w1);
var w2=new THREE.Mesh(wheelG,wmat);w2.position.set(0,.55,-1.05);w2.castShadow=true;bike.add(w2);
var bodyM=new THREE.Mesh(new THREE.SphereGeometry(.95,10,8),toon(0xff7a4d));bodyM.scale.set(.72,.62,1.35);bodyM.position.y=.95;bodyM.castShadow=true;bike.add(bodyM);
var nose=new THREE.Mesh(new THREE.ConeGeometry(.5,1.1,8),toon(0xffd94d));nose.rotation.x=Math.PI/2.6;nose.position.set(0,1.15,1.5);nose.castShadow=true;bike.add(nose);
var shield=new THREE.Mesh(new THREE.SphereGeometry(.62,10,8,0,Math.PI*2,0,1.1),new THREE.MeshToonMaterial({color:0xbfe8ff,transparent:true,opacity:.55}));shield.position.set(0,1.55,1.15);shield.rotation.x=-.5;bike.add(shield);
var bar=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,1.5,6),toon(0x4a4f5a));bar.rotation.z=Math.PI/2;bar.position.set(0,1.42,1.05);bike.add(bar);
// rider
var rider=new THREE.Group();
var torso=new THREE.Mesh(new THREE.CylinderGeometry(.34,.44,.85,8),toon(0x3fa7ff));torso.position.y=1.95;torso.castShadow=true;rider.add(torso);
var head=new THREE.Mesh(new THREE.SphereGeometry(.34,10,8),toon(0xffc9a3));head.position.y=2.65;head.castShadow=true;rider.add(head);
var helmet=new THREE.Mesh(new THREE.SphereGeometry(.4,10,8,0,Math.PI*2,0,1.5),toon(0xff5d73));helmet.position.y=2.72;rider.add(helmet);
var armL=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,.8,6),toon(0x3fa7ff));armL.position.set(-.42,2.05,.5);armL.rotation.x=-1;rider.add(armL);
var armR=armL.clone();armR.position.x=.42;rider.add(armR);
bike.add(rider);
bike.position.set(0,0,0);scene.add(bike);

// dust particles
var dust=[];var dustMat=toon(0xe8c9a0);
for(var di=0;di<14;di++){var d=new THREE.Mesh(new THREE.SphereGeometry(rand(.12,.26),6,5),dustMat);d.visible=false;scene.add(d);dust.push({m:d,life:0});}
function puff(x,y,z){for(var i=0;i<dust.length;i++){if(dust[i].life<=0){dust[i].m.position.set(x+rand(-.3,.3),y,z+rand(-.3,.3));dust[i].life=1;dust[i].m.visible=true;break;}}}

// audio
var AC=null,muted=false,musicNodes=[];
function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function beep(f,d,type,g){if(!AC||muted)return;try{var o=AC.createOscillator(),gn=AC.createGain();o.type=type||'sine';o.frequency.value=f;gn.gain.setValueAtTime(g||.12,AC.currentTime);gn.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(gn);gn.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
var musicTimer=null;
function startMusic(){if(musicTimer||!AC)return;var step=0;var seq=[262,330,392,523,392,330,294,392];musicTimer=setInterval(function(){if(muted||!running)return;var f=seq[step%seq.length];beep(f,.22,'triangle',.05);if(step%2===0)beep(f/2,.3,'sine',.045);step++;},300);}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null;}}

// state
var running=false,paused=false,dead=false;
var speed=12,score=0,best=0,hearts=3,invuln=0,dist=0;
var vx=0,jumpY=0,jumping=false;
try{best=parseInt(localStorage.getItem('motoTrailBest')||'0',10)||0;}catch(e){}
function updateBestTags(){document.getElementById('besttag').textContent=best>0?('Best: '+best):'';document.getElementById('besttag2').textContent='Best: '+best;}
updateBestTags();
function drawHearts(){var h=document.getElementById('hearts');h.innerHTML='';for(var i=0;i<3;i++){var d=document.createElement('div');d.className='heart'+(i<hearts?'':' off');h.appendChild(d);}}
drawHearts();

var keys={};
window.addEventListener('keydown',function(e){keys[e.code]=true;if(e.code==='Space'){e.preventDefault();doJump();}});
window.addEventListener('keyup',function(e){keys[e.code]=false;});
function bindHold(id,code){var el=document.getElementById(id);var on=function(e){e.preventDefault();keys[code]=true;};var off=function(e){e.preventDefault();keys[code]=false;};el.addEventListener('touchstart',on,{passive:false});el.addEventListener('touchend',off);el.addEventListener('mousedown',on);el.addEventListener('mouseup',off);el.addEventListener('mouseleave',off);}
bindHold('sleft','ArrowLeft');bindHold('sright','ArrowRight');
document.getElementById('jumpbtn').addEventListener('touchstart',function(e){e.preventDefault();doJump();},{passive:false});
document.getElementById('jumpbtn').addEventListener('mousedown',function(e){e.preventDefault();doJump();});
var tx0=null;canvas.addEventListener('touchstart',function(e){tx0=e.touches[0].clientX;},{passive:true});
canvas.addEventListener('touchmove',function(e){if(tx0===null)return;var dx=e.touches[0].clientX-tx0;if(dx>40){keys['ArrowRight']=true;keys['ArrowLeft']=false;tx0=e.touches[0].clientX;}else if(dx<-40){keys['ArrowLeft']=true;keys['ArrowRight']=false;tx0=e.touches[0].clientX;}},{passive:true});
canvas.addEventListener('touchend',function(){tx0=null;keys['ArrowLeft']=false;keys['ArrowRight']=false;});

function doJump(){if(!running||paused||dead)return;if(!jumping){jumping=true;jumpY=8.5;beep(520,.18,'square',.08);}}
document.getElementById('mutebtn').addEventListener('click',function(){muted=!muted;this.textContent=muted?'X':'S';this.style.background=muted?'rgba(150,40,60,.85)':'rgba(30,16,46,.72)';});
document.getElementById('pausebtn').addEventListener('click',function(){if(!running||dead)return;paused=!paused;this.textContent=paused?'>':'| |';});

function startGame(){
  audioInit();if(AC&&AC.state==='suspended')AC.resume();
  score=0;hearts=3;speed=12;dist=0;invuln=0;dead=false;paused=false;jumping=false;jumpY=0;vx=0;bike.position.set(0,0,0);
  var i;for(i=0;i<obstacles.length;i++)scene.remove(obstacles[i]);for(i=0;i<orbs.length;i++)scene.remove(orbs[i]);
  obstacles=[];orbs=[];nextWave=-60;
  drawHearts();document.getElementById('score').textContent='0';
  document.getElementById('menu').classList.add('hidden');document.getElementById('over').classList.add('hidden');
  running=true;startMusic();
}
document.getElementById('startbtn').addEventListener('click',startGame);
document.getElementById('retrybtn').addEventListener('click',startGame);

function gameOver(){
  dead=true;running=false;stopMusic();beep(180,.5,'sawtooth',.1);beep(120,.7,'sawtooth',.08);
  var s=Math.floor(score);if(s>best){best=s;try{localStorage.setItem('motoTrailBest',''+best);}catch(e){}}
  document.getElementById('finalscore').textContent='Score: '+s+'   Distance: '+Math.floor(dist)+'m';
  updateBestTags();
  setTimeout(function(){document.getElementById('over').classList.remove('hidden');},600);
}

var clock=new THREE.Clock();
var camPos=new THREE.Vector3(0,5.2,8.5);
function animate(){
  requestAnimationFrame(animate);
  var dt=Math.min(clock.getDelta(),.05);
  if(running&&!paused&&!dead){
    speed=Math.min(26,speed+dt*.45);
    dist+=speed*dt;score+=speed*dt*2;
    // steering
    var steer=0;if(keys['ArrowLeft']||keys['KeyA'])steer-=1;if(keys['ArrowRight']||keys['KeyD'])steer+=1;
    vx+=steer*38*dt;vx*=(1-Math.min(1,7*dt));
    bike.position.x+=vx*dt;
    if(bike.position.x>4.4){bike.position.x=4.4;vx=0;}
    if(bike.position.x<-4.4){bike.position.x=-4.4;vx=0;}
    bike.rotation.z=-vx*.028;bike.rotation.y=-vx*.012;
    // jump
    if(jumping){bike.position.y+=jumpY*dt;jumpY-=24*dt;if(bike.position.y<=0){bike.position.y=0;jumping=false;puff(bike.position.x,.3,0);beep(200,.08,'sine',.06);}}
    // move world toward player
    var move=speed*dt;
    trail1.position.z+=move;trail2.position.z+=move;
    if(trail1.position.z>250)trail1.position.z-=1000;
    if(trail2.position.z>250)trail2.position.z-=1000;
    var i,o;
    for(i=0;i<scenery.length;i++){o=scenery[i];o.position.z+=move;if(o.position.z>30){o.position.z-=rand(480,520);o.position.x=(Math.random()<.5?-1:1)*rand(7,40);}}
    // waves
    nextWave+=move;
    if(nextWave>-140){spawnWave(-170);nextWave=-170-rand(0,26)-Math.max(0,(22-speed))*4;}
    // obstacles
    for(i=obstacles.length-1;i>=0;i--){o=obstacles[i];o.position.z+=move;
      if(o.position.z>12){scene.remove(o);obstacles.splice(i,1);continue;}
      if(invuln<=0&&Math.abs(o.position.z-0)<1.15&&Math.abs(o.position.x-bike.position.x)<1.05&&bike.position.y<1.15){
        hearts--;invuln=1.2;drawHearts();beep(140,.3,'sawtooth',.14);puff(bike.position.x,1,0);
        scene.remove(o);obstacles.splice(i,1);
        if(hearts<=0){gameOver();}
        continue;}
    }
    // orbs
    for(i=orbs.length-1;i>=0;i--){o=orbs[i];o.position.z+=move;o.rotation.y+=3*dt;o.position.y=1.1+Math.sin(clock.elapsedTime*4+o.position.z)*.15;
      if(o.position.z>12){scene.remove(o);orbs.splice(i,1);continue;}
      if(Math.abs(o.position.z)<1.2&&Math.abs(o.position.x-bike.position.x)<1.1&&bike.position.y<2.2){
        score+=50;beep(880+Math.random()*220,.12,'sine',.1);puff(o.position.x,1.2,o.position.z);scene.remove(o);orbs.splice(i,1);}
    }
    if(invuln>0)invuln-=dt;
    // dust while riding
    if(Math.random()<dt*14&&!jumping)puff(bike.position.x+rand(-.4,.4),.25,1.4);
    document.getElementById('score').textContent=''+Math.floor(score);
    // wobble
    bike.rotation.x=Math.sin(clock.elapsedTime*9)*.02;
    rider.rotation.x=-.12+Math.sin(clock.elapsedTime*9)*.03;
  }
  // dust decay
  for(var j=0;j<dust.length;j++){var dd=dust[j];if(dd.life>0){dd.life-=dt*1.6;dd.m.position.y+=dt*1.2;dd.m.scale.setScalar(Math.max(.01,dd.life));if(dd.life<=0)dd.m.visible=false;}}
  // camera follow
  camPos.x+=(bike.position.x*.55-camPos.x)*Math.min(1,5*dt);
  camera.position.set(camPos.x,5.2+bike.position.y*.35,8.5);
  camera.lookAt(bike.position.x*.7,1.6+bike.position.y*.4,-8);
  dl.position.set(bike.position.x+30,50,bike.position.z-40);dl.target.position.set(bike.position.x,0,bike.position.z-10);dl.target.updateMatrixWorld();
  renderer.render(scene,camera);
}
animate();
})();
</script>
</body>
</html>
