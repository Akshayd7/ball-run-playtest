<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poko Pile</title>
<style>
  /* ---------- Global layout ---------- */
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    /* Bright, cheerful backdrop (never black) */
    background: #ffe9c9;
    /* Lock down touch behaviors so the canvas gets raw input */
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* Canvas always fills the visible screen; letterboxing is drawn in-code */
  canvas#game {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';

/* =========================================================
   POKO PILE — part 1: boot, coordinate system, helpers,
   storage, and the WebAudio audio module.
   ========================================================= */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

/* ---------------------------------------------------------
   Canvas resize + fixed internal design coordinates (390x844)
   The game logic always runs in DESIGN_W x DESIGN_H space.
   The transform maps design space onto the physical canvas,
   scaled uniformly to fit, centered (letterboxed).
   --------------------------------------------------------- */
const DESIGN_W = 390;
const DESIGN_H = 844;

let viewScale = 1;   // device pixels per design unit
let viewOX = 0;      // x offset of design origin on canvas (device px)
let viewOY = 0;      // y offset of design origin on canvas (device px)

function resizeCanvas() {
  const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
  const cssW = window.innerWidth;
  const cssH = window.innerHeight;

  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';

  // Uniform scale to fit design space inside the canvas (letterbox)
  viewScale = Math.min(canvas.width / DESIGN_W, canvas.height / DESIGN_H);
  viewOX = (canvas.width - DESIGN_W * viewScale) / 2;
  viewOY = (canvas.height - DESIGN_H * viewScale) / 2;
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', resizeCanvas);
resizeCanvas();

// Convert a pointer event to design-space coordinates
function eventToDesign(e) {
  const rect = canvas.getBoundingClientRect();
  const dpr = canvas.width / rect.width;
  const px = (e.clientX - rect.left) * dpr;
  const py = (e.clientY - rect.top) * dpr;
  return {
    x: (px - viewOX) / viewScale,
    y: (py - viewOY) / viewScale
  };
}

// Apply the design-space transform to the context.
// Call at the start of each frame, after clearing.
function applyViewTransform() {
  ctx.setTransform(viewScale, 0, 0, viewScale, viewOX, viewOY);
}

/* ---------------------------------------------------------
   Small math helpers
   --------------------------------------------------------- */
function rand(min, max) {
  return min + Math.random() * (max - min);
}
function lerp(a, b, t) {
  return a + (b - a) * t;
}
function clamp(v, min, max) {
  return v < min ? min : (v > max ? max : v);
}

/* ---------------------------------------------------------
   Persistent storage helpers (localStorage)
   --------------------------------------------------------- */
function loadBest() {
  const v = parseInt(localStorage.getItem('poko_best'), 10);
  return Number.isFinite(v) ? v : 0;
}
function saveBest(score) {
  try { localStorage.setItem('poko_best', String(Math.floor(score))); } catch (e) {}
}

function loadMute() {
  return localStorage.getItem('poko_mute') === '1';
}
function saveMute(m) {
  try { localStorage.setItem('poko_mute', m ? '1' : '0'); } catch (e) {}
}

/* ---------------------------------------------------------
   Audio module (WebAudio)
   - AudioContext is created lazily on the first user gesture
     (browsers block audio before interaction).
   - All sound routes through a master gain so mute is instant.
   --------------------------------------------------------- */
const Audio = (() => {
  let actx = null;         // AudioContext, created on first gesture
  let masterGain = null;   // everything connects through here
  let muted = loadMute();  // persisted mute state
  let musicStarted = false;

  // Create the context + master chain (must be called from a gesture)
  function ensureContext() {
    if (actx) return actx;
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = actx.createGain();
      masterGain.gain.value = muted ? 0 : 1;
      masterGain.connect(actx.destination);
    } catch (e) {
      actx = null;
    }
    return actx;
  }

  // One short enveloped oscillator note
  function note({ freq, type = 'triangle', at = 0, dur = 0.15, vol = 0.2, slide = 0 }) {
    if (!actx) return;
    const t0 = actx.currentTime + at;
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t0 + dur);
    // Soft attack/decay envelope to avoid clicks
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  /* ---------- Sound effects ---------- */

  // Pop: when a poko lands on the pile
  function sfxPop() {
    if (!ensureContext()) return;
    const f = rand(300, 420);
    note({ freq: f, type: 'triangle', dur: 0.12, vol: 0.25, slide: f * 1.4 });
    note({ freq: f * 2, type: 'sine', at: 0.02, dur: 0.08, vol: 0.12 });
  }

  // Perfect stack: pitch rises with combo count
  function sfxPerfect(combo) {
    if (!ensureContext()) return;
    const step = Math.min(12, Math.max(0, combo | 0));
    const base = 520 * Math.pow(2, step / 12); // one semitone per combo
    note({ freq: base, type: 'square', dur: 0.1, vol: 0.09 });
    note({ freq: base * 1.5, type: 'triangle', at: 0.07, dur: 0.14, vol: 0.16 });
  }

  // Miss / game over: a sad little downward slide
  function sfxMiss() {
    if (!ensureContext()) return;
    note({ freq: 330, type: 'square', dur: 0.35, vol: 0.12, slide: -260 });
    note({ freq: 220, type: 'triangle', at: 0.08, dur: 0.4, vol: 0.14, slide: -140 });
  }

  /* ---------- Music ----------
     A cheerful loop: simple chord-friendly melody over a soft
     bass pulse. Notes are scheduled ahead in small windows and
     re-scheduled by a timer so it loops seamlessly at low gain. */

  // Melody as [beatOffset, frequencyHz, durationBeats]
  const MELODY = [
    [0.0, 523.25, 0.5], [0.5, 587.33, 0.5], [1.0, 659.25, 1.0],
    [2.0, 587.33, 0.5], [2.5, 523.25, 0.5], [3.0, 392.00, 1.0],
    [4.0, 440.00, 0.5], [4.5, 493.88, 0.5], [5.0, 523.25, 1.0],
    [6.0, 587.33, 0.5], [6.5, 659.25, 0.5], [7.0, 523.25, 1.0],
    [8.0, 659.25, 0.5], [8.5, 587.33, 0.5], [9.0, 523.25, 0.5], [9.5, 587.33, 0.5],
    [10.0, 659.25, 1.0], [11.0, 783.99, 1.0],
    [12.0, 587.33, 0.5], [12.5, 523.25, 0.5], [13.0, 493.88, 1.0],
    [14.0, 440.00, 1.0], [15.0, 523.25, 1.0]
  ];
  const BPM = 112;
  const BEAT = 60 / BPM;
  const LOOP_BEATS = 16; // melody wraps every 16 beats
  let schedTimer = null;
  let schedBeat = 0; // next beat index to schedule

  function scheduleWindow() {
    if (!actx || !masterGain) return;
    // Schedule notes up to ~1.2 s ahead of "now"
    const horizon = actx.currentTime + 1.2;
    while (true) {
      const loopPos = schedBeat % LOOP_BEATS;
      const events = MELODY.filter(ev => Math.floor(ev[0]) === loopPos);
      const barStartTime = musicStartTime + schedBeat * BEAT;
      if (barStartTime > horizon) break;
      for (const ev of events) {
        const at = barStartTime + (ev[0] - loopPos) * BEAT - actx.currentTime;
        if (at >= -0.05) {
          note({ freq: ev[1], type: 'triangle', at, dur: ev[2] * BEAT * 0.9, vol: 0.045 });
        }
      }
      // Soft bass pulse every beat keeps it moving
      const bassFreq = (loopPos % 4 < 2) ? 130.81 : 146.83;
      note({ freq: bassFreq, type: 'sine', at: barStartTime - actx.currentTime, dur: BEAT * 0.6, vol: 0.05 });
      schedBeat++;
    }
  }

  let musicStartTime = 0;
  function startMusic() {
    if (!ensureContext() || musicStarted) return;
    musicStarted = true;
    musicStartTime = actx.currentTime + 0.1;
    schedBeat = 0;
    scheduleWindow();
    schedTimer = setInterval(scheduleWindow, 300);
  }

  function stopMusic() {
    if (schedTimer) { clearInterval(schedTimer); schedTimer = null; }
    musicStarted = false;
  }

  /* ---------- Mute control ---------- */
  function setMuted(m) {
    muted = m;
    saveMute(m);
    if (masterGain && actx) {
      masterGain.gain.cancelScheduledValues(actx.currentTime);
      masterGain.gain.setTargetAtTime(m ? 0 : 1, actx.currentTime, 0.03);
    }
  }
  function toggleMute() {
    setMuted(!muted);
    return muted;
  }
  function isMuted() {
    return muted;
  }

  return { ensureContext, sfxPop, sfxPerfect, sfxMiss, startMusic, stopMusic, setMuted, toggleMute, isMuted };
})();

// Bare aliases so gameplay code can call audio directly
const { ensureContext, sfxPop, sfxPerfect, sfxMiss, startMusic, stopMusic, setMuted, toggleMute, isMuted } = Audio;

// Unlock audio on the first user gesture (required by mobile browsers)
['pointerdown', 'touchstart', 'keydown'].forEach(evt => {
  window.addEventListener(evt, function unlock() {
    Audio.ensureContext();
    Audio.startMusic();
    window.removeEventListener(evt, unlock);
  }, { once: true, passive: true });
});

/* =========================================================
   POKO PILE — part 2: scenery themes
   Four bright background themes used by the main renderer.
   Each theme exposes:
     name, skyTop, skyBottom, groundTop, groundBottom,
     drawBackground(ctx, t, cameraY), drawGround(ctx, cameraY)
   Design space is 390x844; cameraY > 0 shifts scenery down
   (used as the pile grows) with a soft parallax factor.
   ========================================================= */

// Reference horizon: ground band occupies the bottom of the screen
const GROUND_Y = 720; // design-space y where ground starts

// ---------- Shared drawing micro-helpers (theme-local) ----------

function fillRoundedRect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
  ctx.fill();
}

function fillCircle(ctx, x, y, r) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

// Vertical linear gradient helper
function vGradient(ctx, y0, y1, c0, c1) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, c0);
  g.addColorStop(1, c1);
  return g;
}

// Drifting puffy cloud made of overlapping circles
function drawCloud(ctx, x, y, s, color) {
  ctx.fillStyle = color;
  fillCircle(ctx, x, y, 22 * s);
  fillCircle(ctx, x + 24 * s, y + 6 * s, 18 * s);
  fillCircle(ctx, x - 24 * s, y + 8 * s, 16 * s);
  fillCircle(ctx, x + 6 * s, y + 14 * s, 20 * s);
  // flat-ish bottom
  fillCircle(ctx, x - 10 * s, y + 16 * s, 14 * s);
}

// Tiny V-shaped bird with a gentle flap
function drawBird(ctx, x, y, s, t, color) {
  const flap = Math.sin(t * 6 + x * 0.1) * 5 * s;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5 * s;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - 8 * s, y + flap);
  ctx.quadraticCurveTo(x, y - 4 * s, x, y);
  ctx.quadraticCurveTo(x, y - 4 * s, x + 8 * s, y + flap);
  ctx.stroke();
}

// Twinkling 4-point star (diamond sparkle)
function drawSparkleStar(ctx, x, y, r, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#fff8d8';
  ctx.beginPath();
  ctx.moveTo(x, y - r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.quadraticCurveTo(x, y, x, y + r);
  ctx.quadraticCurveTo(x, y, x - r, y);
  ctx.quadraticCurveTo(x, y, x, y - r);
  ctx.fill();
  ctx.restore();
}

/* =========================================================
   THEME 1 — Meadow Morning
   ========================================================= */
const THEME_MEADOW = {
  name: 'Meadow Morning',
  skyTop: '#7ecbff',
  skyBottom: '#d8f3ff',
  groundTop: '#6fdd57',
  groundBottom: '#3fae44',

  drawBackground(ctx, t, cameraY) {
    // Sky gradient (parallax-free, always fills the view)
    ctx.fillStyle = vGradient(ctx, 0, GROUND_Y, this.skyTop, this.skyBottom);
    ctx.fillRect(0, 0, 390, GROUND_Y + 10);

    // Smiling sun with rotating soft rays
    const sx = 316, sy = 96 - cameraY * 0.04;
    ctx.save();
    ctx.translate(sx, sy);
    // rays
    ctx.strokeStyle = '#ffd94d';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    for (let i = 0; i < 8; i++) {
      const a = t * 0.3 + (i / 8) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 40, Math.sin(a) * 40);
      ctx.lineTo(Math.cos(a) * 52, Math.sin(a) * 52);
      ctx.stroke();
    }
    // disc
    fillCircle(ctx, 0, 0, 32);
    ctx.fillStyle = '#ffde59';
    fillCircle(ctx, 0, 0, 32);
    ctx.fillStyle = '#ffe98a';
    fillCircle(ctx, -8, -8, 12);
    // face
    ctx.fillStyle = '#f29a2e';
    fillCircle(ctx, -10, -4, 3);
    fillCircle(ctx, 10, -4, 3);
    ctx.strokeStyle = '#f29a2e';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 4, 8, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
    ctx.restore();

    // 3 drifting clouds (different speeds/sizes)
    const cloudDefs = [
      { x0: 60, y: 150, s: 1.0, sp: 9 },
      { x0: 230, y: 90, s: 0.75, sp: 13 },
      { x0: 150, y: 230, s: 1.2, sp: 6 }
    ];
    for (let i = 0; i < cloudDefs.length; i++) {
      const c = cloudDefs[i];
      const x = ((c.x0 + t * c.sp) % (390 + 140)) - 70;
      ctx.globalAlpha = 0.92;
      drawCloud(ctx, x, c.y - cameraY * 0.06, c.s, '#ffffff');
      ctx.globalAlpha = 1;
    }

    // Small V-shaped birds
    drawBird(ctx, (120 + t * 14) % 460 - 30, 190 - cameraY * 0.05, 1, t, '#3a6ea8');
    drawBird(ctx, (250 + t * 10) % 460 - 30, 130 - cameraY * 0.05, 0.8, t + 2, '#3a6ea8');

    // Rolling green hills (two layers, slight parallax)
    ctx.fillStyle = '#8fe66f';
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y - cameraY * 0.1);
    ctx.quadraticCurveTo(95, GROUND_Y - 110 - cameraY * 0.1, 210, GROUND_Y - 55 - cameraY * 0.1);
    ctx.quadraticCurveTo(310, GROUND_Y - 10 - cameraY * 0.1, 390, GROUND_Y - 60 - cameraY * 0.1);
    ctx.lineTo(390, GROUND_Y + 10);
    ctx.lineTo(0, GROUND_Y + 10);
    ctx.closePath();
    ctx.fill();

    // Tiny flowers dotted on the hill line
    const petals = ['#ff7ab8', '#ffd23f', '#ff8c42', '#b98bff'];
    for (let i = 0; i < 7; i++) {
      const fx = 25 + i * 52 + (i % 2) * 12;
      const fy = GROUND_Y - 22 - cameraY * 0.12 + Math.sin(i * 1.7) * 16;
      ctx.fillStyle = petals[i % petals.length];
      for (let p = 0; p < 5; p++) {
        const a = (p / 5) * Math.PI * 2;
        fillCircle(ctx, fx + Math.cos(a) * 5, fy + Math.sin(a) * 5, 3.4);
      }
      ctx.fillStyle = '#fff3b0';
      fillCircle(ctx, fx, fy, 2.6);
    }
  },

  drawGround(ctx, cameraY) {
    // Solid grass band with a lighter top lip
    ctx.fillStyle = vGradient(ctx, GROUND_Y, 844, this.groundTop, this.groundBottom);
    ctx.fillRect(0, GROUND_Y - cameraY, 390, 844 - GROUND_Y + cameraY + 10);
    ctx.fillStyle = '#9df07c';
    ctx.fillRect(0, GROUND_Y - cameraY, 390, 10);
    // Simple grass blades
    ctx.fillStyle = '#4cbf4e';
    for (let i = 0; i < 12; i++) {
      const gx = 12 + i * 32;
      const gy = GROUND_Y - cameraY + 26 + (i % 3) * 22;
      ctx.beginPath();
      ctx.ellipse(gx, gy, 3, 8, -0.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
};

/* =========================================================
   THEME 2 — Candy Sunset
   ========================================================= */
const THEME_CANDY = {
  name: 'Candy Sunset',
  skyTop: '#ff9a5c',
  skyBottom: '#ff6fa5',
  groundTop: '#c05ce0',
  groundBottom: '#8e3fb8',

  drawBackground(ctx, t, cameraY) {
    // Warm sunset gradient
    ctx.fillStyle = vGradient(ctx, 0, GROUND_Y, this.skyTop, this.skyBottom);
    ctx.fillRect(0, 0, 390, GROUND_Y + 10);

    // Big low striped sun sitting near the horizon
    const sy = GROUND_Y - 90 - cameraY * 0.05;
    ctx.save();
    ctx.beginPath();
    ctx.arc(195, sy, 70, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = '#ffd23f';
    ctx.fillRect(125, sy - 70, 140, 140);
    ctx.fillStyle = '#ff9d3f';
    for (let i = 0; i < 4; i++) {
      ctx.fillRect(125, sy - 70 + i * 34 + 18, 140, 12);
    }
    ctx.restore();
    // glow ring
    ctx.strokeStyle = 'rgba(255, 230, 120, 0.55)';
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.arc(195, sy, 80, 0, Math.PI * 2);
    ctx.stroke();

    // Purple drifting clouds
    const defs = [
      { x0: 40, y: 120, s: 1.1, sp: 7 },
      { x0: 260, y: 190, s: 0.9, sp: 11 },
      { x0: 160, y: 60, s: 0.8, sp: 5 }
    ];
    for (let i = 0; i < defs.length; i++) {
      const c = defs[i];
      const x = ((c.x0 + t * c.sp) % (390 + 150)) - 75;
      ctx.globalAlpha = 0.85;
      drawCloud(ctx, x, c.y - cameraY * 0.06, c.s, '#b06fe0');
      ctx.globalAlpha = 1;
    }

    // Lollipop trees on the horizon
    const trees = [
      { x: 55, r: 30, st: '#ff5d8f', sw: '#ff8fb0' },
      { x: 335, r: 24, st: '#5cd6ff', sw: '#9aeaff' },
      { x: 150, r: 20, st: '#ffd23f', sw: '#ffe98a' }
    ];
    for (const tr of trees) {
      const ty = GROUND_Y - 8 - cameraY * 0.1;
      // stick
      ctx.fillStyle = '#f7f3e8';
      ctx.fillRect(tr.x - 3, ty - tr.r * 1.8, 6, tr.r * 1.8);
      // swirl canopy: colored disc + inner swirl stripes
      ctx.fillStyle = tr.st;
      fillCircle(ctx, tr.x, ty - tr.r * 1.6, tr.r);
      ctx.fillStyle = tr.sw;
      ctx.beginPath();
      ctx.arc(tr.x, ty - tr.r * 1.6, tr.r * 0.62, 0.4, 3.2);
      ctx.arc(tr.x, ty - tr.r * 1.6, tr.r * 0.3, 3.2, 0.4, true);
      ctx.closePath();
      ctx.fill();
      fillCircle(ctx, tr.x - tr.r * 0.25, ty - tr.r * 1.75, tr.r * 0.22);
    }
  },

  drawGround(ctx, cameraY) {
    // Purple candy meadow
    ctx.fillStyle = vGradient(ctx, GROUND_Y, 844, this.groundTop, this.groundBottom);
    ctx.fillRect(0, GROUND_Y - cameraY, 390, 844 - GROUND_Y + cameraY + 10);
    // Gumdrop bumps along the top lip
    ctx.fillStyle = '#e08bff';
    for (let i = 0; i < 9; i++) {
      fillCircle(ctx, 10 + i * 46, GROUND_Y - cameraY + 6, 9);
    }
    // Sprinkle dots
    const dots = ['#fff', '#ffe066', '#66e0ff', '#ff9ecb'];
    ctx.fillStyle = dots[0];
    for (let i = 0; i < 14; i++) {
      ctx.fillStyle = dots[i % dots.length];
      fillCircle(ctx, 14 + i * 28, GROUND_Y - cameraY + 34 + (i % 4) * 16, 3);
    }
  }
};

/* =========================================================
   THEME 3 — Starry Night
   (deep blue-purple, colorful, NEVER pure black)
   ========================================================= */
const THEME_NIGHT = {
  name: 'Starry Night',
  skyTop: '#2b2a6e',
  skyBottom: '#6a4fb3',
  groundTop: '#3f8ef7',
  groundBottom: '#2c5fd0',

  // Fixed star field positions (generated once, stable)
  stars: null,

  ensureStars() {
    if (!this.stars) {
      this.stars = [];
      for (let i = 0; i < 26; i++) {
        this.stars.push({
          x: rand(10, 380),
          y: rand(20, GROUND_Y - 60),
          r: rand(3, 7),
          ph: rand(0, Math.PI * 2)
        });
      }
    }
  },

  drawBackground(ctx, t, cameraY) {
    this.ensureStars();

    // Deep but colorful night gradient
    ctx.fillStyle = vGradient(ctx, 0, GROUND_Y, this.skyTop, this.skyBottom);
    ctx.fillRect(0, 0, 390, GROUND_Y + 10);

    // Crescent moon: big circle minus offset circle (composite path)
    const mx = 310, my = 100 - cameraY * 0.04;
    ctx.fillStyle = '#fff1a8';
    ctx.beginPath();
    ctx.arc(mx, my, 30, 0, Math.PI * 2);
    ctx.arc(mx + 12, my - 8, 26, 0, Math.PI * 2, true);
    ctx.fill();
    // moon glow
    ctx.strokeStyle = 'rgba(255, 241, 168, 0.35)';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.arc(mx, my, 38, 0, Math.PI * 2);
    ctx.stroke();

    // Twinkling 4-point stars
    for (const s of this.stars) {
      const tw = 0.45 + 0.55 * Math.abs(Math.sin(t * 2 + s.ph));
      drawSparkleStar(ctx, s.x, s.y - cameraY * 0.05, s.r, tw);
    }

    // Soft purple hill silhouettes
    ctx.fillStyle = '#573fa8';
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y - cameraY * 0.1);
    ctx.quadraticCurveTo(120, GROUND_Y - 90 - cameraY * 0.1, 240, GROUND_Y - 45 - cameraY * 0.1);
    ctx.quadraticCurveTo(320, GROUND_Y - 8 - cameraY * 0.1, 390, GROUND_Y - 50 - cameraY * 0.1);
    ctx.lineTo(390, GROUND_Y + 10);
    ctx.lineTo(0, GROUND_Y + 10);
    ctx.closePath();
    ctx.fill();

    // Glowing mushrooms along the hill
    const shrooms = [
      { x: 60, y: GROUND_Y - 34, s: 1 },
      { x: 205, y: GROUND_Y - 52, s: 0.8 },
      { x: 330, y: GROUND_Y - 40, s: 1.1 }
    ];
    for (const m of shrooms) {
      const y = m.y - cameraY * 0.12;
      // glow halo
      ctx.fillStyle = 'rgba(120, 240, 200, 0.25)';
      fillCircle(ctx, m.x, y, 20 * m.s);
      // stem + cap
      ctx.fillStyle = '#e8f6ff';
      ctx.fillRect(m.x - 4 * m.s, y - 8 * m.s, 8 * m.s, 14 * m.s);

      ctx.beginPath();
      ctx.arc(m.x, y - 8 * m.s, 11 * m.s, Math.PI, 0);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#c8ffe9';
      fillCircle(ctx, m.x - 4 * m.s, y - 12 * m.s, 2.4 * m.s);
      fillCircle(ctx, m.x + 5 * m.s, y - 10 * m.s, 2 * m.s);
    }
  },

  drawGround(ctx, cameraY) {
    // Cool blue night meadow
    ctx.fillStyle = vGradient(ctx, GROUND_Y, 844, this.groundTop, this.groundBottom);
    ctx.fillRect(0, GROUND_Y - cameraY, 390, 844 - GROUND_Y + cameraY + 10);
    // Sparkle dots in the grass
    for (let i = 0; i < 10; i++) {
      const tw = 0.35 + 0.65 * Math.abs(Math.sin(i * 1.3));
      ctx.globalAlpha = tw;
      ctx.fillStyle = '#bfe0ff';
      fillCircle(ctx, 18 + i * 38, GROUND_Y - cameraY + 30 + (i % 3) * 20, 2.5);
      ctx.globalAlpha = 1;
    }
  }
};

  skyBottom: '#bdf6ef',

    ctx.quadraticCurveTo(320, GROUND_Y - 12 - cameraY * 0.1, 390, GROUND_Y - 55 - cameraY * 0.1);

/* ---------- Theme registry (index 0 is the starting theme) ---------- */
const THEMES = [THEME_MEADOW, THEME_CANDY, THEME_NIGHT, THEME_RAINBOW];

/* =========================================================
   POKO PILE — part 3: animal pals + effects
   ========================================================= */

/* ---------------------------------------------------------
   1) ANIMALS registry: 7 original kawaii pals.
   body: saturated candy color; ear: shape key; muzzle: style key
   --------------------------------------------------------- */
const ANIMALS = [
  { name: 'bear',  body: '#d98e4a', ear: 'round',   muzzle: 'snout' },
  { name: 'bunny', body: '#ff9ec4', ear: 'long',    muzzle: 'tinyNose' },
  { name: 'cat',   body: '#ffcf4d', ear: 'pointed', muzzle: 'whiskerNose' },
  { name: 'fox',   body: '#ff7a45', ear: 'pointed', muzzle: 'whiskerNose' },
  { name: 'panda', body: '#f6f2ea', ear: 'roundDark', muzzle: 'snout' },
  { name: 'frog',  body: '#6bde6b', ear: 'eyeBumps', muzzle: 'wideSmile' },
  { name: 'chick', body: '#ffe94d', ear: 'tuft',    muzzle: 'beak' }
];

// Darker outline shade per body color (generated once)
const OUTLINES = {};
for (const a of ANIMALS) {
  OUTLINES[a.body] = shadeColor(a.body, -0.35);
}

// Simple hex color shading helper (amt<0 darker, >0 lighter)
function shadeColor(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + Math.round(255 * amt), 0, 255);
  const g = clamp(((n >> 8) & 255) + Math.round(255 * amt), 0, 255);
  const b = clamp((n & 255) + Math.round(255 * amt), 0, 255);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

/* ---------------------------------------------------------
   2) drawPal — kawaii face + body.
   (x, y) = top-left of the body box; w, h = its size.
   mode: 'normal' | 'celebrate' | 'worried'
   --------------------------------------------------------- */
function drawPal(ctx, x, y, w, h, animalIndex, mode) {
  mode = mode || 'normal';
  const a = ANIMALS[animalIndex % ANIMALS.length];
  const cx = x + w / 2;
  const outline = OUTLINES[a.body];
  const dark = shadeColor(a.body, -0.25);

  // Ear positions depend on body box
  const earY = y + h * 0.14;

  /* ---- Ears (drawn first, tucked behind body) ---- */
  if (a.ear === 'round') {
    // bear: two round ears with inner ear dot
    for (const s of [-1, 1]) {
      ctx.fillStyle = outline; fillCircle(ctx, cx + s * w * 0.32, earY, w * 0.14);
      ctx.fillStyle = a.body;  fillCircle(ctx, cx + s * w * 0.32, earY, w * 0.115);
      ctx.fillStyle = '#ffd6e8'; fillCircle(ctx, cx + s * w * 0.32, earY, w * 0.06);
    }
  } else if (a.ear === 'roundDark') {
    // panda: black circle ears
    for (const s of [-1, 1]) {
      ctx.fillStyle = outline; fillCircle(ctx, cx + s * w * 0.32, earY, w * 0.14);
      ctx.fillStyle = '#3a3a44'; fillCircle(ctx, cx + s * w * 0.32, earY, w * 0.125);
    }
  } else if (a.ear === 'long') {
    // bunny: tall inner-pink ovals
    for (const s of [-1, 1]) {
      ctx.save();
      ctx.translate(cx + s * w * 0.22, earY - h * 0.10);
      ctx.rotate(s * 0.12);
      ctx.fillStyle = outline;
      ctx.beginPath(); ctx.ellipse(0, 0, w * 0.09, h * 0.17, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = a.body;
      ctx.beginPath(); ctx.ellipse(0, 0, w * 0.07, h * 0.15, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffc2dd';
      ctx.beginPath(); ctx.ellipse(0, 0, w * 0.035, h * 0.10, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  } else if (a.ear === 'pointed') {
    // cat/fox: triangles with inner fill
    for (const s of [-1, 1]) {
      const tx = cx + s * w * 0.30, ty = earY + 2;
      ctx.fillStyle = outline;
      ctx.beginPath();
      ctx.moveTo(tx + s * w * 0.14, ty + h * 0.03);
      ctx.lineTo(tx, ty - h * 0.13);
      ctx.lineTo(tx - s * w * 0.02, ty + h * 0.06);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = a.body;
      ctx.beginPath();
      ctx.moveTo(tx + s * w * 0.11, ty + h * 0.02);
      ctx.lineTo(tx, ty - h * 0.10);
      ctx.lineTo(tx - s * w * 0.015, ty + h * 0.045);
      ctx.closePath(); ctx.fill();
      if (a.name === 'fox') { // fox ear tips are dark
        ctx.fillStyle = '#5a2f1e';
        ctx.beginPath();
        ctx.moveTo(tx + s * w * 0.05, ty - h * 0.055);
        ctx.lineTo(tx, ty - h * 0.10);
        ctx.lineTo(tx - s * w * 0.01, ty - h * 0.03);
        ctx.closePath(); ctx.fill();
      }
    }
  } else if (a.ear === 'eyeBumps') {
    // frog: two bumps on top of head (eyes sit in them)
    for (const s of [-1, 1]) {
      ctx.fillStyle = outline;
      fillCircle(ctx, cx + s * w * 0.20, y + h * 0.10, w * 0.135);
      ctx.fillStyle = a.body;
      fillCircle(ctx, cx + s * w * 0.20, y + h * 0.10, w * 0.11);
    }
  } else if (a.ear === 'tuft') {
    // chick: tiny 3-feather head tuft
    ctx.strokeStyle = outline;
    ctx.lineWidth = Math.max(2, w * 0.035);
    ctx.lineCap = 'round';
    for (const s of [-1, 0, 1]) {
      ctx.beginPath();
      ctx.moveTo(cx + s * w * 0.05, y + h * 0.05);
      ctx.quadraticCurveTo(cx + s * w * 0.10, y - h * 0.03, cx + s * w * 0.14, y - h * 0.05);
      ctx.stroke();
    }
  }

  /* ---- Body: rounded rect ---- */
  ctx.fillStyle = a.body;
  fillRoundedRect(ctx, x, y, w, h, w * 0.3);
  ctx.strokeStyle = outline;
  ctx.lineWidth = Math.max(2.5, w * 0.045);
  ctx.stroke();
  // soft belly highlight
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath();
  ctx.ellipse(cx, y + h * 0.62, w * 0.26, h * 0.2, 0, 0, Math.PI * 2);
  ctx.fill();

  /* ---- Face layout ---- */
  const eyeY = y + h * 0.42;
  const eyeDX = w * 0.19;
  const eyeR = w * 0.085;
  const blushDX = w * 0.32;

  // Blush cheeks (always)
  ctx.fillStyle = 'rgba(255,130,160,0.5)';
  fillCircle(ctx, cx - blushDX, eyeY + eyeR * 0.9, eyeR * 0.75);
  fillCircle(ctx, cx + blushDX, eyeY + eyeR * 0.9, eyeR * 0.75);

  // Frog eyes live in the bumps, higher up
  const fy = a.ear === 'eyeBumps' ? y + h * 0.10 : eyeY;
  const fdx = a.ear === 'eyeBumps' ? w * 0.20 : eyeDX;

  if (mode === 'celebrate') {
    // Happy closed arc eyes (^ ^)
    ctx.strokeStyle = '#2b2b33';
    ctx.lineWidth = Math.max(3, eyeR * 0.45);
    ctx.lineCap = 'round';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(cx + s * fdx, fy + eyeR * 0.25, eyeR, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();
    }
  } else {
    // Big white eyes with pupils + shine
    for (const s of [-1, 1]) {
      const ex = cx + s * fdx;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(ex, fy, eyeR, eyeR * 1.15, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = outline;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      const py = mode === 'worried' ? fy - eyeR * 0.25 : fy + eyeR * 0.05;
      ctx.fillStyle = '#2b2b33';
      fillCircle(ctx, ex, py, eyeR * 0.52);
      ctx.fillStyle = '#ffffff';
      fillCircle(ctx, ex - eyeR * 0.18, py - eyeR * 0.2, eyeR * 0.16);
    }
  }

  // Worried raised brows
  if (mode === 'worried') {
    ctx.strokeStyle = '#2b2b33';
    ctx.lineWidth = Math.max(2.5, eyeR * 0.3);
    ctx.lineCap = 'round';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(cx + s * fdx - eyeR * 0.7, fy - eyeR * 1.6);
      ctx.quadraticCurveTo(cx + s * fdx, fy - eyeR * 2.0, cx + s * fdx + eyeR * 0.7, fy - eyeR * 1.6);
      ctx.stroke();
    }
  }

  /* ---- Muzzle / mouth ---- */
  const mY = y + h * 0.64;

  if (a.muzzle === 'snout') {
    // bear/panda: oval muzzle with nose + small mouth
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.ellipse(cx, mY, w * 0.17, h * 0.11, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3a3a44';
    ctx.beginPath(); ctx.ellipse(cx, mY - h * 0.015, w * 0.055, h * 0.04, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#3a3a44'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx, mY + h * 0.02);
    ctx.quadraticCurveTo(cx, mY + h * 0.06, cx - w * 0.045, mY + h * 0.07);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx, mY + h * 0.02);
    ctx.quadraticCurveTo(cx, mY + h * 0.06, cx + w * 0.045, mY + h * 0.07);
    ctx.stroke();
  } else if (a.muzzle === 'whiskerNose') {
    // cat/fox: triangle nose, w mouth, optional whiskers
    ctx.fillStyle = '#5a3b6e';
    ctx.beginPath();
    ctx.moveTo(cx, mY - h * 0.02);
    ctx.lineTo(cx + w * 0.045, mY + h * 0.015);
    ctx.lineTo(cx - w * 0.045, mY + h * 0.015);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#3a3a44'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx, mY + h * 0.015);
    ctx.quadraticCurveTo(cx, mY + h * 0.05, cx - w * 0.05, mY + h * 0.05);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx, mY + h * 0.015);
    ctx.quadraticCurveTo(cx, mY + h * 0.05, cx + w * 0.05, mY + h * 0.05);
    ctx.stroke();
    // whiskers
    ctx.strokeStyle = 'rgba(58,58,68,0.55)';
    ctx.lineWidth = 1.6;
    for (const s of [-1, 1]) {
      for (const dy of [-0.01, 0.03]) {
        ctx.beginPath();
        ctx.moveTo(cx + s * w * 0.07, mY + h * dy);
        ctx.lineTo(cx + s * w * 0.24, mY + h * (dy - 0.025));
        ctx.stroke();
      }
    }
  } else if (a.muzzle === 'wideSmile') {
    // frog: big wide smile
    ctx.strokeStyle = '#2f7a35';
    ctx.lineWidth = Math.max(3, w * 0.05);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(cx, mY - h * 0.03, w * 0.2, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();
  } else if (a.muzzle === 'beak') {
    // chick: small orange triangle beak
    ctx.fillStyle = '#ff8c42';
    ctx.strokeStyle = '#e06a1f';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - w * 0.09, mY);
    ctx.lineTo(cx + w * 0.09, mY);
    ctx.lineTo(cx, mY + h * 0.07);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  } else if (a.muzzle === 'tinyNose') {
    // bunny: tiny pink nose + Y mouth
    ctx.fillStyle = '#e05a8a';
    fillCircle(ctx, cx, mY - h * 0.01, w * 0.035);
    ctx.strokeStyle = '#3a3a44'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx, mY + h * 0.01);
    ctx.lineTo(cx, mY + h * 0.045);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx, mY + h * 0.045);
    ctx.lineTo(cx - w * 0.05, mY + h * 0.07);
    ctx.moveTo(cx, mY + h * 0.045);
    ctx.lineTo(cx + w * 0.05, mY + h * 0.07);
    ctx.stroke();
  }

  // Expression overrides on the mouth
  if (mode === 'celebrate') {
    // open smiling mouth (covers most muzzle styles)
    ctx.fillStyle = '#a53d4d';
    ctx.beginPath();
    ctx.ellipse(cx, y + h * 0.7, w * 0.13, h * 0.07, 0, 0, Math.PI);
    ctx.fill();
    ctx.fillStyle = '#ff9ec4';
    ctx.beginPath();
    ctx.ellipse(cx, y + h * 0.7, w * 0.07, h * 0.03, 0, 0, Math.PI);
    ctx.fill();
  } else if (mode === 'worried') {
    // small "o" mouth
    ctx.fillStyle = '#5a3b4e';
    fillCircle(ctx, cx, y + h * 0.72, w * 0.045);
  }
}

/* ---------------------------------------------------------
   3) Confetti burst
   --------------------------------------------------------- */
const CONFETTI_COLORS = ['#ff6b6b', '#ffd23f', '#6bde6b', '#5aa9ff', '#b98bff', '#ff9ec4'];
const confetti = [];

function spawnConfetti(x, y) {
  for (let i = 0; i < 24; i++) {
    const ang = rand(-Math.PI, 0);            // burst upward-ish
    const speed = rand(140, 420);
    confetti.push({
      x, y,
      vx: Math.cos(ang) * speed * rand(0.5, 1),
      vy: Math.sin(ang) * speed,
      rot: rand(0, Math.PI * 2),
      vr: rand(-8, 8),
      size: rand(5, 10),
      color: CONFETTI_COLORS[i % CONFETTI_COLORS.length],
      life: rand(0.8, 1.4)
    });
  }
}

function updateAndDrawConfetti(ctx, dt) {
  for (let i = confetti.length - 1; i >= 0; i--) {
    const c = confetti[i];
    c.life -= dt;
    if (c.life <= 0) { confetti.splice(i, 1); continue; }
    // physics
    c.vy += 780 * dt;      // gravity
    c.vx *= 0.99;
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.rot += c.vr * dt;
    // draw
    ctx.save();
    ctx.globalAlpha = clamp(c.life, 0, 1);
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.size / 2, -c.size / 3, c.size, c.size * 0.66);
    ctx.restore();
  }
}

/* ---------------------------------------------------------
   4) drawMuteButton — rounded square, speaker icon,
   X through it when muted. Returns its rect for hit-testing.
   --------------------------------------------------------- */
const MUTE_BTN = { x: 390 - 58, y: 14, w: 44, h: 44 };

function drawMuteButton(ctx) {
  const b = MUTE_BTN;
  // plate
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  fillRoundedRect(ctx, b.x, b.y, b.w, b.h, 12);
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // speaker icon (centered)
  const cx = b.x + b.w / 2 - 3;
  const cy = b.y + b.h / 2;
  ctx.fillStyle = '#5a5a6e';
  ctx.beginPath(); // speaker box
  ctx.fillRect(cx - 11, cy - 5, 7, 10);
  ctx.beginPath(); // speaker cone
  ctx.moveTo(cx - 4, cy);
  ctx.lineTo(cx + 4, cy - 8);
  ctx.lineTo(cx + 4, cy + 8);
  ctx.closePath();
  ctx.fill();

  if (Audio.isMuted()) {
    // red X across the whole button
    ctx.strokeStyle = '#ff4d6d';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(b.x + 9, b.y + 9);
    ctx.lineTo(b.x + b.w - 9, b.y + b.h - 9);
    ctx.moveTo(b.x + b.w - 9, b.y + 9);
    ctx.lineTo(b.x + 9, b.y + b.h - 9);
    ctx.stroke();
  } else {
    // sound arcs
    ctx.strokeStyle = '#5a5a6e';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(cx + 4, cy, 7, -Math.PI / 3, Math.PI / 3);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx + 4, cy, 12, -Math.PI / 3, Math.PI / 3);
    ctx.stroke();
  }
}

// Returns true if a tap hits the mute button
function muteButtonHit(px, py) {
  return px >= MUTE_BTN.x - 6 && px <= MUTE_BTN.x + MUTE_BTN.w + 6 &&
         py >= MUTE_BTN.y - 6 && py <= MUTE_BTN.y + MUTE_BTN.h + 6;
}

/* =========================================================
   POKO PILE — part 4: core game state & logic
   (screen rendering comes in the next part)
   World coordinates: pals live in design space, drawn later
   shifted down by cameraY so a growing pile stays in view.
   ========================================================= */

/* ---------- Tunables ---------- */
const PAL_H = 46;    // height of one pal slab
const START_W = 220; // width of the first pal
const MARGIN = 20;   // side margin for the moving pal

/* ---------- Game state ---------- */
let gameState = 'start';   // 'start' | 'playing' | 'gameover'
let score = 0;
let best = loadBest();
let combo = 0;
let themeIndex = 0;

let stack = [];            // placed pals: {x, y, w, h, animalIndex}
let movingPal = null;      // {x, y, w, h, dir, speed, animalIndex}
let fallingPieces = [];    // sliced/missed pieces: {x, y, w, h, animalIndex, vx, vy, rot, vr}

let cameraY = 0;           // current world scroll (eased)
let nextAnimalIndex = Math.floor(rand(0, ANIMALS.length));

let flashT = 0;            // white flash intensity (theme switch)
let scorePopT = 0;         // HUD score pop timer (perfect drop)

/* ---------- Reset ---------- */
function resetGame() {
  stack = [{
    x: (DESIGN_W - START_W) / 2,
    y: GROUND_Y - PAL_H,
    w: START_W,
    h: PAL_H,
    animalIndex: nextAnimalIndex++ % ANIMALS.length
  }];
  score = 0;
  combo = 0;
  themeIndex = 0;
  fallingPieces = [];
  confetti.length = 0;
  cameraY = 0;
  flashT = 0;
  scorePopT = 0;
  gameState = 'playing';
  spawnMovingPal();
}

/* ---------- Moving pal ---------- */
// Spawn a new pal sliding above the top of the stack.
// Width matches the current top pal; speed grows with score.
function spawnMovingPal() {
  const top = stack[stack.length - 1];
  const dir = Math.random() < 0.5 ? -1 : 1;
  movingPal = {
    x: dir === 1 ? MARGIN : DESIGN_W - MARGIN - top.w,
    y: GROUND_Y - (stack.length + 1) * PAL_H,
    w: top.w,
    h: PAL_H,
    dir,
    speed: 150 + Math.min(score * 6, 280),
    animalIndex: nextAnimalIndex++ % ANIMALS.length
  };
}

/* ---------- Drop / slice logic ---------- */
function dropPal() {
  if (!movingPal || gameState !== 'playing') return;
  const top = stack[stack.length - 1];
  const m = movingPal;

  // Horizontal overlap with the top pal
  const left = Math.max(m.x, top.x);
  const right = Math.min(m.x + m.w, top.x + top.w);
  const overlapW = right - left;

  if (overlapW <= 0) {
    /* --- Total miss: the whole pal tumbles away, game over --- */
    fallingPieces.push({
      x: m.x, y: m.y, w: m.w, h: m.h, animalIndex: m.animalIndex,
      vx: m.dir * 120, vy: -60, rot: 0, vr: m.dir * 4
    });
    movingPal = null;
    sfxMiss();
    if (score > best) { best = score; saveBest(best); }
    gameState = 'gameover';
    return;
  }

  const offsetY = m.y;             // world y of this level
  const offset = m.x - top.x;      // signed offset vs. top pal

  if (Math.abs(offset) <= 8) {
    /* --- PERFECT: snap flush, no slice, combo grows --- */
    stack.push({ x: top.x, y: offsetY, w: top.w, h: PAL_H, animalIndex: m.animalIndex });
    combo++;
    score += 1 + combo;
    scorePopT = 1;
    sfxPerfect(combo);
    spawnConfetti(top.x + top.w / 2, offsetY + cameraY + PAL_H / 2);
  } else {
    /* --- Normal drop: trim overhang into a tumbling piece --- */
    combo = 0;
    score += 1;
    sfxPop();
    if (offset > 0) {
      // overhang hangs off the right edge
      fallingPieces.push({
        x: right, y: offsetY, w: m.x + m.w - right, h: PAL_H, animalIndex: m.animalIndex,
        vx: rand(60, 140), vy: -30, rot: 0, vr: rand(2, 5)
      });
    } else {
      // overhang hangs off the left edge
      fallingPieces.push({
        x: m.x, y: offsetY, w: left - m.x, h: PAL_H, animalIndex: m.animalIndex,
        vx: -rand(60, 140), vy: -30, rot: 0, vr: -rand(2, 5)
      });
    }
    stack.push({ x: left, y: offsetY, w: overlapW, h: PAL_H, animalIndex: m.animalIndex });
  }

  movingPal = null;

  // Theme switch every 10 layers, with a quick white flash
  if (stack.length % 10 === 0) {
    themeIndex = (themeIndex + 1) % THEMES.length;
    flashT = 1;
  }

  spawnMovingPal();
}

/* ---------- Per-frame update ---------- */
function updateGame(dt) {
  if (gameState === 'playing' && movingPal) {
    // Slide the pal, bouncing between the side margins
    movingPal.x += movingPal.dir * movingPal.speed * dt;
    if (movingPal.x <= MARGIN) {
      movingPal.x = MARGIN;
      movingPal.dir = 1;
    } else if (movingPal.x + movingPal.w >= DESIGN_W - MARGIN) {
      movingPal.x = DESIGN_W - MARGIN - movingPal.w;
      movingPal.dir = -1;
    }
  }

  // Falling pieces: gravity + tumble, cull off-screen
  for (let i = fallingPieces.length - 1; i >= 0; i--) {
    const p = fallingPieces[i];
    p.vy += 900 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.vr * dt;
    if (p.y + cameraY > DESIGN_H + 80) fallingPieces.splice(i, 1);
  }

  // Ease the camera so the stack top sits ~58% from the screen top
  const target = Math.max(0, stack.length * PAL_H - (GROUND_Y - DESIGN_H * 0.58));
  cameraY = lerp(cameraY, target, Math.min(1, dt * 6));

  // Decay flash + score pop timers (confetti updates during render pass)
  if (flashT > 0) flashT = Math.max(0, flashT - dt * 2.5);
  if (scorePopT > 0) scorePopT = Math.max(0, scorePopT - dt * 2);
}

/* =========================================================
   POKO PILE — part 5: screen rendering
   (input + main loop + init come in the next part)
   World objects use screenY = worldY + cameraY (camera
   "climbs" with the pile). Theme functions receive -cameraY
   so their internal scenery/ground math shifts the same way.
   ========================================================= */

// HUD helpers
let hudLastScore = -1;

// Outlined centered text (white stroke + colored fill)
function outlinedText(ctx, text, x, y, size, fill, strokeW) {
  ctx.save();
  ctx.font = '900 ' + size + 'px "Arial Rounded MT Bold", "Arial Black", Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = strokeW || size * 0.18;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(text, x, y);
  ctx.restore();
}

// Semi-transparent pill behind HUD text, centered on (x, y)
function hudPill(ctx, text, x, y, size) {
  ctx.save();
  ctx.font = '900 ' + size + 'px "Arial Rounded MT Bold", "Arial Black", Arial, sans-serif';
  const w = ctx.measureText(text).width;
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.beginPath();
  ctx.roundRect(x - w / 2 - 18, y - size / 2 - 8, w + 36, size + 16, 20);
  ctx.fill();
  ctx.restore();
}

/* ---------------------------------------------------------
   1) START screen
   --------------------------------------------------------- */
function drawStart(ctx, t) {
  const th = THEMES[themeIndex];
  th.drawBackground(ctx, t, 0);
  th.drawGround(ctx, 0);

  // Logo: a cute stack of 3 pals (top one celebrating)
  const cx = 195;
  drawPal(ctx, cx - 90, 470, 180, 64, (nextAnimalIndex + 5) % ANIMALS.length, 'normal');
  drawPal(ctx, cx - 75, 408, 150, 58, (nextAnimalIndex + 3) % ANIMALS.length, 'normal');
  drawPal(ctx, cx - 60, 348, 120, 56, nextAnimalIndex % ANIMALS.length, 'celebrate');

  // Big bubbly title (shadow layer + white outline + candy fill)
  ctx.save();
  ctx.font = '900 58px "Arial Rounded MT Bold", "Arial Black", Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.fillStyle = 'rgba(180, 60, 110, 0.35)';
  ctx.fillText('POKO PILE', cx + 4, 164 + 5);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 14;
  ctx.strokeText('POKO PILE', cx, 164);
  ctx.fillStyle = '#ff5d8f';
  ctx.fillText('POKO PILE', cx, 164);
  ctx.restore();

  // Best score line
  outlinedText(ctx, 'BEST: ' + best, cx, 246, 26, '#7a4ea8', 6);

  // Pulsing call to action
  ctx.globalAlpha = 0.55 + 0.45 * Math.abs(Math.sin(t * 2.6));
  outlinedText(ctx, 'TAP TO START', cx, 640, 30, '#ff8c42', 7);
  ctx.globalAlpha = 1;
}

/* ---------------------------------------------------------
   2) GAME screen (world via camera + screen-space HUD)
   --------------------------------------------------------- */
function drawGame(ctx, t) {
  const th = THEMES[themeIndex];

  // ---- world layer ----
  th.drawBackground(ctx, t, -cameraY);
  th.drawGround(ctx, -cameraY);

  // Falling sliced pieces (tumbling, worried faces)
  for (const p of fallingPieces) {
    ctx.save();
    ctx.translate(p.x + p.w / 2, p.y + p.h / 2 + cameraY);
    ctx.rotate(p.rot);
    drawPal(ctx, -p.w / 2, -p.h / 2, p.w, p.h, p.animalIndex, 'worried');
    ctx.restore();
  }

  // Stack pals (top celebrates right after a perfect drop)
  for (let i = 0; i < stack.length; i++) {
    const p = stack[i];
    const mode = (i === stack.length - 1 && combo > 0) ? 'celebrate' : 'normal';
    drawPal(ctx, p.x, p.y + cameraY, p.w, p.h, p.animalIndex, mode);
  }

  // Moving pal hovers above the stack, nervous
  if (movingPal && gameState === 'playing') {
    const m = movingPal;
    drawPal(ctx, m.x, m.y + cameraY, m.w, m.h, m.animalIndex, 'worried');
  }

  // ---- screen-space HUD ----
  // Pop the score when it changes
  if (score !== hudLastScore) {
    scorePopT = Math.max(scorePopT, 0.99);
    hudLastScore = score;
  }
  const pop = 1 + 0.35 * scorePopT;
  ctx.save();
  ctx.translate(195, 84);
  ctx.scale(pop, pop);
  hudPill(ctx, String(score), 0, 0, 52);
  outlinedText(ctx, String(score), 0, 0, 52, '#ff5d8f', 10);
  ctx.restore();

  // Combo badge
  if (combo > 1) {
    const comboText = 'COMBO x' + combo + '!';
    hudPill(ctx, comboText, 195, 128, 24);
    outlinedText(ctx, comboText, 195, 128, 24, '#ff9d3f', 6);
  }

  drawMuteButton(ctx);
}

/* ---------------------------------------------------------
   3) GAME OVER screen (soft white overlay + panel)
   --------------------------------------------------------- */
function drawGameOver(ctx, t) {
  // Frozen scene behind the overlay
  const th = THEMES[themeIndex];
  th.drawBackground(ctx, t, -cameraY);
  th.drawGround(ctx, -cameraY);
  for (const p of stack) {
    drawPal(ctx, p.x, p.y + cameraY, p.w, p.h, p.animalIndex, 'normal');
  }

  // Dimming overlay: playful white wash (never black)
  ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
  ctx.fillRect(0, 0, DESIGN_W, DESIGN_H);

  // Panel
  const px = 45, py = 220, pw = 300, ph = 400;
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.strokeStyle = '#ffb0c8';
  ctx.lineWidth = 5;
  fillRoundedRect(ctx, px, py, pw, ph, 28);
  ctx.stroke();

  const cx = px + pw / 2;
  outlinedText(ctx, 'GAME OVER', cx, py + 52, 34, '#ff5d8f', 8);

  // One worried pal in the panel
  const topAnimal = stack.length ? stack[stack.length - 1].animalIndex : 0;
  drawPal(ctx, cx - 70, py + 92, 140, 64, topAnimal, 'worried');

  outlinedText(ctx, 'SCORE: ' + score, cx, py + 210, 30, '#ff9d3f', 7);
  if (score >= best && score > 0) {
    outlinedText(ctx, 'NEW BEST!', cx, py + 252, 24, '#6bde6b', 6);
  } else {
    outlinedText(ctx, 'BEST: ' + best, cx, py + 252, 24, '#7a4ea8', 6);
  }

  // Pulsing call to action
  ctx.globalAlpha = 0.55 + 0.45 * Math.abs(Math.sin(t * 2.6));
  outlinedText(ctx, 'TAP TO PLAY AGAIN', cx, py + 336, 24, '#ff8c42', 6);
  ctx.globalAlpha = 1;
}

/* ---------------------------------------------------------
   4) Render dispatcher
   --------------------------------------------------------- */
function render(ctx, t) {
  applyViewTransform();
  ctx.clearRect(-2, -2, DESIGN_W + 4, DESIGN_H + 4);

  if (gameState === 'playing') {
    drawGame(ctx, t);
  } else if (gameState === 'gameover') {
    drawGameOver(ctx, t);
  } else {
    drawStart(ctx, t);
  }
}

/* =========================================================
   POKO PILE — part 6 (final): input, main loop, init
   ========================================================= */

/* ---------------------------------------------------------
   1) Tap handling — x, y are design-space coordinates
   --------------------------------------------------------- */
function handleTap(x, y) {
  if (gameState === 'playing') {
    // Mute button is its own hit target (no drop)
    if (muteButtonHit(x, y)) {
      Audio.toggleMute();
      return;
    }
    dropPal();
  } else if (gameState === 'start') {
    resetGame();          // sets gameState = 'playing'
    Audio.startMusic();
    gameState = 'playing';
  } else if (gameState === 'gameover') {
    resetGame();
    gameState = 'playing';
  }
}

/* ---------------------------------------------------------
   2) Input bindings
   --------------------------------------------------------- */
function onPoint(e) {
  // Map client coords into the 390x844 design space (part1 transform)
  const p = eventToDesign(e);
  handleTap(p.x, p.y);
}

canvas.addEventListener('pointerdown', onPoint);

// Raw touch fallback: block scrolling/zooming while playing
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const tch = e.touches && e.touches[0];
  if (tch) {
    const p = eventToDesign(tch); // Touch has clientX/clientY too
    handleTap(p.x, p.y);
  }
}, { passive: false });

// Keyboard play: Space / Enter act as a tap anywhere
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    handleTap(-1, -1); // off-button coords: never hits the mute icon
  }
});

/* ---------------------------------------------------------
   3) Main loop
   --------------------------------------------------------- */
let lastTime = performance.now();

function frame(now) {
  const dt = clamp((now - lastTime) / 1000, 0, 0.05);
  lastTime = now;
  const t = now / 1000;

  // Simulation only while playing
  if (gameState === 'playing') updateGame(dt);

  // Draw the scene (render applies the design-space transform)
  render(ctx, t);

  // Confetti lives in design space too; update + draw after render
  // while the view transform is still active.
  updateAndDrawConfetti(ctx, dt);

  requestAnimationFrame(frame);
}

/* ---------------------------------------------------------
   4) Init
   --------------------------------------------------------- */
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', resizeCanvas);

resizeCanvas();                 // size the canvas before first frame
best = loadBest();              // restore persisted values
Audio.setMuted(loadMute());     // apply mute state to the master gain
gameState = 'start';            // begin on the title screen

requestAnimationFrame(frame);

</script>
</body>
