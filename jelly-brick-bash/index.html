<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Jelly Brick Bash</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #241d4e; font-family: 'Segoe UI','Trebuchet MS',Roboto,Helvetica,Arial,sans-serif; touch-action: none; overscroll-behavior: none; }
  #game-container { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; background: linear-gradient(#3b2f6b 0%, #7b4fd0 45%, #ff8fb3 100%); }
  canvas { display: block; }
</style>
</head>
<body>
<div id="game-container"><canvas id="game"></canvas></div>
<script>
"use strict";
/* JELLY BRICK BASH v4 - original kids cartoon brick-breaker. Single file, no external assets. */
var W = 800, H = 450, IS_PORTRAIT = false;
var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");
var DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  var cw = window.innerWidth, ch = window.innerHeight;
  var portrait = ch > cw;
  if (portrait !== IS_PORTRAIT || (portrait && H !== Math.max(700, Math.min(1000, Math.round(ch / (cw / 460)))))) {
    IS_PORTRAIT = portrait;
    if (portrait) {
      W = 460;
      H = Math.round(ch / (cw / 460));
      H = Math.max(700, Math.min(1000, H));
    } else { W = 800; H = 450; }
    relayout();
  }
  var scale = Math.min(cw / W, ch / H);
  var pw = Math.round(W * scale), ph = Math.round(H * scale);
  canvas.style.width = pw + "px"; canvas.style.height = ph + "px";
  canvas.width = Math.round(W * scale * DPR); canvas.height = Math.round(H * scale * DPR);
}
function gridParams(l) {
  var cols = IS_PORTRAIT ? 7 : 9;
  var bw = IS_PORTRAIT ? 58 : 74, bh = 26, gap = IS_PORTRAIT ? 6 : 8;
  var ox = (W - (cols*bw + (cols-1)*gap))/2, oy = IS_PORTRAIT ? 116 : 70;
  return { rows: levelRows(l), cols: cols, bw: bw, bh: bh, gap: gap, ox: ox, oy: oy };
}
function relayout() {
  if (typeof bricks === "undefined" || typeof paddle === "undefined") return;
  var gp = gridParams(level);
  var cellW = gp.bw + gp.gap, cellH = gp.bh + gp.gap;
  for (var i = 0; i < bricks.length; i++) {
    var r = Math.floor(i / gp.cols), c = i % gp.cols;
    bricks[i].x = gp.ox + c*cellW;
    bricks[i].y = gp.oy + r*cellH;
    bricks[i].w = gp.bw; bricks[i].h = gp.bh;
  }
  paddle.y = IS_PORTRAIT ? H - 70 : H - 34;
  paddle.x = Math.max(paddle.w/2 + 6, Math.min(W - paddle.w/2 - 6, paddle.x));
  balls.forEach(function(b){
    if (b.stuck) { b.x = paddle.x; b.y = paddle.y - 22; }
    else { b.x = Math.max(12, Math.min(W-12, b.x)); b.y = Math.max(12, Math.min(H-40, b.y)); }
  });
  powerups.forEach(function(p){ p.x = Math.max(12, Math.min(W-12, p.x)); });
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", function(){ setTimeout(resize, 60); });
resize();

/* ---------------- audio (all synthesized) ---------------- */
var AC = null, masterGain = null, musicGain = null, sfxGain = null, muted = false;
function audioInit() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = AC.createGain(); masterGain.gain.value = muted ? 0 : 1; masterGain.connect(AC.destination);
    musicGain = AC.createGain(); musicGain.gain.value = 0.34; musicGain.connect(masterGain);
    sfxGain = AC.createGain(); sfxGain.gain.value = 0.55; sfxGain.connect(masterGain);
    startMusic();
  } catch (e) { AC = null; }
}
function setMuted(m) { muted = m; if (masterGain) masterGain.gain.value = m ? 0 : 1; }
function tone(freq, dur, type, vol, when, dest, slide) {
  if (!AC) return;
  try {
    var t = AC.currentTime + (when || 0);
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.3, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || sfxGain);
    o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
function sfx(name) {
  if (!AC || muted) return;
  switch (name) {
    case "paddle": tone(240, 0.09, "triangle", 0.5, 0, sfxGain, 120); break;
    case "brick": tone(520, 0.07, "square", 0.22, 0, sfxGain, 80); break;
    case "break": tone(660, 0.1, "square", 0.25); tone(880, 0.12, "square", 0.2, 0.05); break;
    case "star": tone(880, 0.08, "sine", 0.35); tone(1175, 0.12, "sine", 0.35, 0.06); break;
    case "frenzy": [523,659,784,1047,1319].forEach(function(f,i){ tone(f, 0.12, "square", 0.3, i*0.06); }); break;
    case "power": tone(523, 0.09, "sine", 0.4); tone(659, 0.09, "sine", 0.4, 0.08); tone(784, 0.14, "sine", 0.4, 0.16); break;
    case "lose": tone(320, 0.35, "sawtooth", 0.3, 0, sfxGain, -220); break;
    case "clear": [523,659,784,1047].forEach(function(f,i){ tone(f, 0.16, "triangle", 0.35, i*0.1); }); break;
    case "over": [392,330,262,196].forEach(function(f,i){ tone(f, 0.28, "triangle", 0.35, i*0.18); }); break;
    case "start": tone(523, 0.1, "triangle", 0.4); tone(784, 0.16, "triangle", 0.4, 0.1); break;
    case "wall": tone(180, 0.05, "triangle", 0.18); break;
  }
}
/* tiny cheerful loop: bass + pluck melody */
var musicTimer = null, musicStep = 0;
var MEL = [523,0,659,0,784,0,659,0, 880,0,784,0,659,0,587,0, 523,0,659,0,784,0,880,0, 784,659,587,0,523,0,0,0];
var BAS = [131,131,165,165, 175,175,165,165, 131,131,165,165, 175,165,147,147];
function startMusic() {
  if (!AC || musicTimer) return;
  musicTimer = setInterval(function () {
    if (muted || !AC) return;
    var i = musicStep % MEL.length;
    var m = MEL[i];
    if (m) tone(m, 0.14, "triangle", 0.16, 0, musicGain);
    if (i % 2 === 0) { var b = BAS[(musicStep >> 1) % BAS.length]; tone(b, 0.22, "sine", 0.2, 0, musicGain); }
    musicStep++;
  }, 170);
}

/* ---------------- game state ---------------- */
var STATE = { START: 0, PLAY: 1, CLEAR: 2, OVER: 3, PAUSE: 4 };
var state = STATE.START;
var score = 0, best = 0, lives = 3, level = 1, combo = 0, scoreMult = 1, scoreMultT = 0;
var runStars = 0, frenzy = 0, totalStars = 0, lastClearStars = 0, starBarPulse = 0;
var newBestFlag = false;
try { best = parseInt(localStorage.getItem("jbb_best") || "0", 10) || 0; } catch (e) {}
try { totalStars = parseInt(localStorage.getItem("jbb_stars") || "0", 10) || 0; } catch (e) {}
function saveBest() { try { localStorage.setItem("jbb_best", String(best)); } catch (e) {} }
function saveStars() { try { localStorage.setItem("jbb_stars", String(totalStars)); } catch (e) {} }

var paddle = { x: W/2, y: IS_PORTRAIT ? H-70 : H-34, w: 112, h: 18, baseW: 112, wobble: 0, wide: 0, vx: 0 };
var balls = [];
var bricks = [];
var powerups = [];
var particles = [];
var floaters = [];
var rings = [];
var shake = 0;
var fxFlash = 0, fxFlashColor = "#ffffff";

/* candy palette (saturated, glossy) */
var BRICK_COLORS = [
  { top:"#ff9fb2", bot:"#ff4d6d" },
  { top:"#ffc078", bot:"#ff8c1a" },
  { top:"#fff08a", bot:"#ffc300" },
  { top:"#b2f26d", bot:"#58cc02" },
  { top:"#7ee8fa", bot:"#15b5e8" },
  { top:"#d3a6ff", bot:"#9333ea" }
];
var BRICK_HP2 = { top:"#9aa7ff", bot:"#4f46e5" };

function levelRows(l) { return Math.min(4 + Math.ceil(l/2), IS_PORTRAIT ? 8 : 7); }
function ballSpeed(l) { return Math.min(340 + (l-1)*24, 510); }
function brickValue(b) {
  if (b.kind === "star") return 50;
  if (b.kind === "gem") return 30;
  if (b.kind === "cage") return 20;
  return b.maxhp > 1 ? 15 : 10;
}

function buildLevel(l) {
  bricks = []; powerups = []; particles = []; floaters = []; rings = [];
  var gp = gridParams(l);
  var rows = gp.rows, cols = gp.cols;
  var bw = gp.bw, bh = gp.bh, gap = gp.gap, ox = gp.ox, oy = gp.oy;
  var starTarget = Math.min(2 + l, 5), starCount = 0;
  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      if (l >= 3 && ((r*7+c*3+l) % 11 === 0)) continue; // holes in later levels
      var kind = "", hp = 1;
      if (((r*3 + c*5 + l) % 13 === 0) && starCount < starTarget) { kind = "star"; hp = 1; starCount++; }
      else if (l >= 2 && ((r*5 + c + l) % 17 === 0)) { kind = "gem"; hp = 3; }
      else if (l >= 3 && ((r + c*2 + l) % 9 === 0)) { kind = "cage"; hp = 2; }
      else if (l >= 2 && ((r + c + l) % 5 === 0)) { hp = 2; }
      bricks.push({ x: ox + c*(bw+gap), y: oy + r*(bh+gap), w: bw, h: bh, hp: hp, maxhp: hp,
        kind: kind, color: BRICK_COLORS[r % BRICK_COLORS.length], wob: Math.random()*6.28, alive: true });
    }
  }
  // guarantee the star quota even if holes removed some
  for (var i = 0; i < bricks.length && starCount < starTarget; i++) {
    var b = bricks[i];
    if (b.alive && !b.kind && b.maxhp === 1) { b.kind = "star"; starCount++; }
  }
  if (bricks.length === 0) bricks.push({ x: W/2-37, y: 100, w: 74, h: 26, hp: 1, maxhp: 1, kind: "", color: BRICK_COLORS[0], wob: 0, alive: true });
}
function resetBall(stuck) {
  balls = [{ x: paddle.x, y: paddle.y - 22, r: 13, vx: 0, vy: 0, stuck: !!stuck, spin: 0, trail: [] }];
}
function launchBall(b, angJitter) {
  var a = -Math.PI/2 + (Math.random()*0.5 - 0.25) + (angJitter || 0);
  var sp = ballSpeed(level);
  b.vx = Math.cos(a)*sp; b.vy = Math.sin(a)*sp; b.stuck = false;
}
function newGame() {
  score = 0; lives = 3; level = 1; combo = 0; scoreMult = 1; scoreMultT = 0;
  runStars = 0; frenzy = 0; newBestFlag = false;
  paddle.w = paddle.baseW; paddle.wide = 0; paddle.vx = 0;
  buildLevel(level); resetBall(true);
  state = STATE.PLAY; sfx("start");
}
function nextLevel() {
  window.__clearT = 0;
  level++;
  buildLevel(level); resetBall(true);
  state = STATE.PLAY;
}

/* ---------------- fx helpers ---------------- */
function addParticles(x, y, color, n) {
  for (var i = 0; i < (n||8); i++) {
    particles.push({ x: x, y: y, vx: (Math.random()-0.5)*260, vy: (Math.random()-0.7)*260,
      life: 0.5 + Math.random()*0.3, t: 0, color: color, r: 2+Math.random()*3 });
  }
}
function addRing(x, y, color) { rings.push({ x: x, y: y, t: 0, color: color }); }
function flash(color, a) { fxFlash = a; fxFlashColor = color; }
function confetti(n) {
  var cols = ["#ff4d6d","#ffc300","#58cc02","#15b5e8","#9333ea","#fff08a"];
  for (var i = 0; i < (n||50); i++) {
    particles.push({ x: W/2 + (Math.random()-0.5)*240, y: H/2 - 40, vx: (Math.random()-0.5)*420, vy: -Math.random()*380 - 60,
      life: 0.9 + Math.random()*0.7, t: 0, color: cols[i % cols.length], r: 3+Math.random()*3 });
  }
}
function spawnFloater(x, y, text, color) {
  var n = 0;
  floaters.forEach(function(f){ if (Math.abs(f.x - x) < 130 && f.t < 0.7) n++; });
  floaters.push({ x: x, y: y - 24*n, text: text, t: 0, color: color || "#fff" });
}
function spawnPowerup(x, y) {
  var kinds = ["W","M","S","L","X","F"];
  var k = kinds[Math.floor(Math.random()*kinds.length)];
  powerups.push({ x: x, y: y, vy: 95, kind: k, t: 0 });
}
function startFrenzy() {
  frenzy = 6; runStars = 0;
  spawnFloater(W/2, H/2 - 30, "FRENZY!", "#ffd166");
  flash("#ffd166", 0.28); shake = Math.min(shake + 4, 8);
  sfx("frenzy");
}
function applyPower(k) {
  sfx("power");
  if (k === "W") { paddle.w = paddle.baseW * 1.6; paddle.wide = 8; spawnFloater(paddle.x, paddle.y-30, "WIDE!", "#b2f26d"); addRing(paddle.x, paddle.y, "#b2f26d"); }
  else if (k === "M") {
    var src = balls.filter(function(b){ return !b.stuck; })[0] || balls[0];
    if (src && balls.length < 4) {
      [-0.5, 0.5].forEach(function (j) {
        var nb = { x: src.x, y: src.y, r: 13, vx: 0, vy: 0, stuck: false, spin: 0, trail: [] };
        var sp = Math.hypot(src.vx, src.vy) || ballSpeed(level);
        var a = Math.atan2(src.vy, src.vx) + j;
        nb.vx = Math.cos(a)*sp; nb.vy = Math.sin(a)*sp;
        balls.push(nb);
      });
      spawnFloater(src.x, src.y-20, "MULTI!", "#7ee8fa"); addRing(src.x, src.y, "#7ee8fa");
    }
  }
  else if (k === "S") { balls.forEach(function(b){ if (!b.stuck) { b.vx *= 0.7; b.vy *= 0.7; } }); spawnFloater(W/2, H/2, "SLOW!", "#fff08a"); }
  else if (k === "L") { lives = Math.min(lives+1, 5); spawnFloater(W/2, H/2, "+1 LIFE!", "#ff9fb2"); }
  else if (k === "X") { scoreMult = 2; scoreMultT = 10; spawnFloater(W/2, H/2, "SCORE x2!", "#d3a6ff"); }
  else if (k === "F") { startFrenzy(); }
}

/* ---------------- playgama bridge (dynamic, never blocks page) ---------------- */
var bridgeReady = false;
function maybeInterstitial(cb) {
  if (bridgeReady && window.bridge && window.bridge.advertisement && window.bridge.advertisement.isInterstitialSupported) {
    try { window.bridge.advertisement.showInterstitial(); } catch (e) {}
  }
  if (cb) cb();
}
function bridgeInit() {
  if (!window.bridge || typeof window.bridge.initialize !== "function") return;
  try {
    window.bridge.initialize().then(function () {
      bridgeReady = true;
      try { window.bridge.platform.sendMessage("game_ready"); } catch (e) {}
      try { setMuted(!window.bridge.platform.isAudioEnabled); } catch (e) {}
      try {
        window.bridge.platform.on(window.bridge.EVENT_NAME.AUDIO_STATE_CHANGED, function (en) { setMuted(!en); });
        window.bridge.platform.on(window.bridge.EVENT_NAME.PAUSE_STATE_CHANGED, function (paused) {
          if (paused && state === STATE.PLAY) state = STATE.PAUSE;
        });
      } catch (e) {}
    }).catch(function () {});
  } catch (e) {}
}
(function loadBridge() {
  try {
    var bs = document.createElement("script");
    bs.src = "https://bridge.playgama.com/v2/stable/playgama-bridge.js";
    bs.async = true;
    bs.onload = function () { try { bridgeInit(); } catch (e) {} };
    bs.onerror = function () {};
    document.head.appendChild(bs);
  } catch (e) {}
})();

/* ---------------- input ---------------- */
var pointerX = null, keys = {};
var fsTried = false;
function toGameX(clientX) {
  var r = canvas.getBoundingClientRect();
  return (clientX - r.left) / r.width * W;
}
function tryFullscreen() {
  if (fsTried) return; fsTried = true;
  try {
    var el = document.documentElement;
    if (el.requestFullscreen) { var p = el.requestFullscreen({ navigationUI: "hide" }); if (p && p.catch) p.catch(function(){}); }
  } catch (e) {}
}
function onMove(clientX) {
  pointerX = Math.max(paddle.w/2+6, Math.min(W-paddle.w/2-6, toGameX(clientX)));
  if (state === STATE.PLAY) {
    paddle.x = pointerX; paddle.vx = 0;
    balls.forEach(function(b){ if(b.stuck){b.x=paddle.x;b.y=paddle.y-b.r-9;} });
  }
}
function onTap(x, y) {
  try { audioInit(); if (AC && AC.state === "suspended") AC.resume(); } catch (e) {}
  tryFullscreen();
  var gx = toGameX(x), r = canvas.getBoundingClientRect();
  var gy = (y - r.top) / r.height * H;
  // mute button hit (top-right circle)
  var dx = gx - (W-30), dy = gy - 30;
  var mr = IS_PORTRAIT ? 30 : 20;
  if (dx*dx + dy*dy <= mr*mr) { setMuted(!muted); return; }
  if (state === STATE.START) { newGame(); onMove(x); return; }
  if (state === STATE.OVER || state === STATE.CLEAR) {
    if (state === STATE.OVER) maybeInterstitial(function(){ state = STATE.START; });
    else nextLevel();
    return;
  }
  if (state === STATE.PLAY) {
    onMove(x);
    balls.forEach(function (b) { if (b.stuck) launchBall(b); });
  }
}
canvas.addEventListener("mousemove", function (e) { onMove(e.clientX); });
canvas.addEventListener("touchmove", function (e) { e.preventDefault(); onMove(e.touches[0].clientX); }, { passive: false });
canvas.addEventListener("mousedown", function (e) { onTap(e.clientX, e.clientY); });
canvas.addEventListener("touchstart", function (e) { e.preventDefault(); onTap(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
window.addEventListener("keydown", function (e) {
  keys[e.key] = true;
  if (e.key === " " || e.key === "Enter") {
    try { audioInit(); } catch (err) {}
    if (state === STATE.START) newGame();
    else if (state === STATE.OVER) maybeInterstitial(function(){ state = STATE.START; });
    else if (state === STATE.CLEAR) nextLevel();
    else balls.forEach(function (b) { if (b.stuck) launchBall(b); });
  }
  if (e.key === "m" || e.key === "M") setMuted(!muted);
});
window.addEventListener("keyup", function (e) { keys[e.key] = false; });
document.addEventListener("visibilitychange", function () {
  if (document.hidden && state === STATE.PLAY) state = STATE.PAUSE;
});

/* ---------------- update ---------------- */
function update(dt) {
  clouds.forEach(function (c) { c.x += c.v * dt; if (c.x > W + 90) c.x = -90; });
  hillsOff += dt * 4;
  if (starBarPulse > 0) starBarPulse = Math.max(0, starBarPulse - dt*3);
  if (fxFlash > 0) fxFlash = Math.max(0, fxFlash - dt*1.6);
  if (state === STATE.PAUSE) return;
  if (state !== STATE.PLAY) return;

  // Direct finger tracking: no spring lag or overshoot on direction changes.
  var desired = 0;
  if (keys["ArrowLeft"] || keys["a"] || keys["A"]) desired = -720;
  else if (keys["ArrowRight"] || keys["d"] || keys["D"]) desired = 720;
  if (desired) { paddle.vx = desired; paddle.x += desired*dt; pointerX = null; }
  else { paddle.vx = 0; if(pointerX !== null) paddle.x = pointerX; }
  paddle.x = Math.max(paddle.w/2 + 6, Math.min(W - paddle.w/2 - 6, paddle.x));
  if (paddle.wide > 0) { paddle.wide -= dt; if (paddle.wide <= 0) paddle.w = paddle.baseW; }
  if (scoreMultT > 0) { scoreMultT -= dt; if (scoreMultT <= 0) scoreMult = 1; }
  if (frenzy > 0) frenzy = Math.max(0, frenzy - dt);

  for (var bi = balls.length - 1; bi >= 0; bi--) {
    var b = balls[bi];
    if (b.stuck) { b.x = paddle.x; b.y = paddle.y - 22; continue; }
    b.x += b.vx * dt; b.y += b.vy * dt; b.spin += dt * 6;
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 7) b.trail.shift();

    if (frenzy <= 0) {
      if (b.x < 8 + b.r) { b.x = 8 + b.r; b.vx = Math.abs(b.vx); sfx("wall"); }
      if (b.x > W - 8 - b.r) { b.x = W - 8 - b.r; b.vx = -Math.abs(b.vx); sfx("wall"); }
    } else {
      if (b.x < -30) { b.x = -30; b.vx = Math.abs(b.vx); }
      if (b.x > W + 30) { b.x = W + 30; b.vx = -Math.abs(b.vx); }
    }
    if (b.y < 8 + b.r) { b.y = 8 + b.r; b.vy = Math.abs(b.vy); sfx("wall"); }

    // paddle bounce with momentum transfer
    if (b.vy > 0 && b.y + b.r >= paddle.y && b.y - b.r <= paddle.y + paddle.h &&
        b.x >= paddle.x - paddle.w/2 - 4 && b.x <= paddle.x + paddle.w/2 + 4) {
      var rel = (b.x - paddle.x) / (paddle.w/2 + 4);
      rel = Math.max(-1, Math.min(1, rel));
      var sp = Math.min(Math.hypot(b.vx, b.vy) * 1.03, ballSpeed(level) * 1.35);
      var ang = -Math.PI/2 + rel * 1.02;
      var vx2 = Math.cos(ang) * sp + paddle.vx * 0.42;
      vx2 = Math.max(-sp*0.92, Math.min(sp*0.92, vx2));
      b.vx = vx2;
      b.vy = -Math.sqrt(Math.max(sp*sp - vx2*vx2, 60*60));
      b.y = paddle.y - b.r - 1;
      combo = 0; paddle.wobble = 1;
      sfx("paddle");
    }

    // bricks
    for (var i = 0; i < bricks.length; i++) {
      var br = bricks[i];
      if (!br.alive) continue;
      if (b.x + b.r > br.x && b.x - b.r < br.x + br.w && b.y + b.r > br.y && b.y - b.r < br.y + br.h) {
        if (frenzy <= 0) {
          var overlapL = (b.x + b.r) - br.x, overlapR = (br.x + br.w) - (b.x - b.r);
          var overlapT = (b.y + b.r) - br.y, overlapB = (br.y + br.h) - (b.y - b.r);
          var minX = Math.min(overlapL, overlapR), minY = Math.min(overlapT, overlapB);
          if (minX < minY) b.vx = (overlapL < overlapR) ? -Math.abs(b.vx) : Math.abs(b.vx);
          else b.vy = (overlapT < overlapB) ? -Math.abs(b.vy) : Math.abs(b.vy);
        }
        br.hp -= (frenzy > 0 ? 99 : 1);
        combo++;
        if (combo > 0 && combo % 8 === 0) { spawnFloater(b.x, b.y - 18, "COMBO x" + (1 + Math.floor(combo/8)), "#ffd166"); sfx("star"); }
        if (br.hp <= 0) {
          br.alive = false;
          var pts = brickValue(br) * scoreMult * (1 + Math.floor(combo/8));
          score += pts;
          addParticles(br.x + br.w/2, br.y + br.h/2, br.kind === "star" ? "#ffd166" : br.color.top, 12);
          addRing(br.x + br.w/2, br.y + br.h/2, br.kind === "star" ? "#ffd166" : br.color.top);
          spawnFloater(br.x + br.w/2, br.y, "+" + pts, "#ffffff");
          if (br.kind === "star") {
            runStars++; starBarPulse = 1; sfx("star");
            spawnFloater(br.x + br.w/2, br.y - 16, "+STAR", "#ffd166");
            if (runStars >= 10) startFrenzy();
          }
          if (Math.random() < 0.16) spawnPowerup(br.x + br.w/2, br.y + br.h/2);
          sfx("break"); shake = Math.min(shake + 2.5, 6);
        } else {
          addParticles(b.x, b.y, "#ffffff", 3);
          sfx("brick");
        }
        break;
      }
    }

    // fell below
    if (b.y - b.r > H + 20) {
      balls.splice(bi, 1);
    }
  }

  // powerups fall
  for (var pi = powerups.length - 1; pi >= 0; pi--) {
    var p = powerups[pi];
    p.y += p.vy * dt; p.t += dt;
    if (p.y > paddle.y - 4 && p.y < paddle.y + paddle.h + 10 && Math.abs(p.x - paddle.x) < paddle.w/2 + 12) {
      applyPower(p.kind); powerups.splice(pi, 1); continue;
    }
    if (p.y > H + 20) powerups.splice(pi, 1);
  }

  // particles / floaters / rings
  for (var qi = particles.length - 1; qi >= 0; qi--) {
    var q = particles[qi]; q.t += dt; q.x += q.vx*dt; q.y += q.vy*dt; q.vy += 500*dt;
    if (q.t > q.life) particles.splice(qi, 1);
  }
  for (var fi = floaters.length - 1; fi >= 0; fi--) {
    var f = floaters[fi]; f.t += dt; f.y -= 34*dt;
    if (f.t > 1) floaters.splice(fi, 1);
  }
  for (var ri = rings.length - 1; ri >= 0; ri--) {
    rings[ri].t += dt;
    if (rings[ri].t > 0.45) rings.splice(ri, 1);
  }
  if (shake > 0) shake = Math.max(0, shake - dt*14);
  if (paddle.wobble > 0) paddle.wobble = Math.max(0, paddle.wobble - dt*4);

  // ball lost
  if (balls.length === 0) {
    lives--; combo = 0; sfx("lose");
    if (lives <= 0) {
      if (score > best) { best = score; saveBest(); newBestFlag = true; confetti(70); }
      state = STATE.OVER; sfx("over");
    } else {
      resetBall(true);
    }
  }

  // level clear
  var remain = 0;
  bricks.forEach(function (bb) { if (bb.alive) remain++; });
  if (remain === 0 && state === STATE.PLAY) {
    var bonus = 50 * level;
    score += bonus;
    lastClearStars = lives >= 3 ? 3 : (lives === 2 ? 2 : 1);
    totalStars += lastClearStars; saveStars();
    if (score > best) { best = score; saveBest(); }
    state = STATE.CLEAR; sfx("clear"); confetti(40);
    if (bridgeReady && level % 2 === 0) maybeInterstitial(null);
  }
}

      drawMascot(W/2, IS_PORTRAIT ? H*0.62 : H*0.66, 1, t);
      if (totalStars > 0) {
        drawStarIcon(W/2 - 34, H - 70, 9, true, false);
        ctx.fillStyle = "#ffd166"; ctx.font = "bold 14px sans-serif";
        ctx.fillText("TOTAL STARS " + totalStars, W/2 + 18, H - 65);
      }
      ctx.fillStyle = "rgba(255,240,138," + (0.6 + 0.4*Math.sin(t*4)) + ")";
      ctx.font = "bold 24px sans-serif";
      ctx.fillText("TAP TO START", W/2, H - 34);
    } else {
      var oy3 = H * 0.36;
      drawTitle("GAME OVER", W/2, oy3, 52, t);
      ctx.textAlign = "center";
      ctx.fillStyle = "#fff"; ctx.font = "bold 24px sans-serif";
      ctx.fillText("SCORE " + score, W/2, oy3 + 50);
      ctx.font = "16px sans-serif"; ctx.fillStyle = "#ffd9e8";
      ctx.fillText("BEST " + best, W/2, oy3 + 76);
      if (newBestFlag) {
        ctx.fillStyle = "rgba(255,209,102," + (0.7 + 0.3*Math.sin(t*6)) + ")";
        ctx.font = "bold 20px sans-serif";
        ctx.fillText("NEW BEST!", W/2, oy3 + 106);
      }
      ctx.fillStyle = "rgba(255,240,138," + (0.6 + 0.4*Math.sin(t*4)) + ")";
      ctx.font = "bold 22px sans-serif";
      ctx.fillText("TAP TO RETRY", W/2, H - 34);
    }
    if (fxFlash > 0) { ctx.globalAlpha = fxFlash; ctx.fillStyle = fxFlashColor; ctx.fillRect(-10,-10,W+20,H+20); ctx.globalAlpha = 1; }
    return;
  }

  if (state === STATE.CLEAR) {
    ctx.fillStyle = "rgba(36,29,78,0.5)"; ctx.fillRect(-10, -10, W+20, H+20);
    var cy2 = H * 0.34;
    drawTitle("LEVEL " + level + " CLEAR!", W/2, cy2, 44, t);
    if (!window.__clearT) window.__clearT = t;
    drawStarsRating(W/2, cy2 + 60, lastClearStars, Math.min(1, t - window.__clearT));
    ctx.textAlign = "center";
    ctx.fillStyle = "#fff"; ctx.font = "18px sans-serif";
    ctx.fillText("Bonus +" + (50*level) + "  -  Score " + score, W/2, cy2 + 106);
    ctx.fillStyle = "rgba(255,240,138," + (0.6 + 0.4*Math.sin(t*4)) + ")";
    ctx.font = "bold 20px sans-serif";
    ctx.fillText("TAP FOR LEVEL " + (level+1), W/2, cy2 + 144);
    particles.forEach(function (p) {
      ctx.globalAlpha = 1 - p.t / p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.3); ctx.fill();
    });
    ctx.globalAlpha = 1;
    return;
  }

  // bricks
  bricks.forEach(function (b) { if (b.alive) drawBrick(b, t); });
  // powerups
  powerups.forEach(function (p) { drawPower(p, t); });
  // particles
  particles.forEach(function (p) {
    ctx.globalAlpha = 1 - p.t / p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.3); ctx.fill();
  });
  ctx.globalAlpha = 1;
  // rings
  rings.forEach(function (rg) {
    ctx.globalAlpha = 1 - rg.t / 0.45;
    ctx.strokeStyle = rg.color; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(rg.x, rg.y, 8 + rg.t * 90, 0, 6.3); ctx.stroke();
  });
  ctx.globalAlpha = 1;
  // floaters
  floaters.forEach(function (f) {
    ctx.globalAlpha = 1 - f.t;
    ctx.font = "bold 15px sans-serif"; ctx.textAlign = "center";
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(36,29,78,0.8)";
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  });
  ctx.globalAlpha = 1;

  // paddle (jelly) - eyes follow the ball, umbrella glow in frenzy
  var fb = balls.filter(function(b2){ return !b2.stuck; })[0];
  var lookX = fb ? Math.max(-2, Math.min(2, (fb.x - paddle.x) / 120)) : 0;
  var squish = 1 + paddle.wobble * 0.18 * Math.sin(t*30);
  var pw = paddle.w * (2 - squish) * 0.5, ph = paddle.h * squish;
  ctx.fillStyle = "rgba(36,29,78,0.3)";
  rr(paddle.x - paddle.w/2 + 3, paddle.y + 5, paddle.w, paddle.h, 10); ctx.fill();
  if (frenzy > 0) {
    ctx.save();
    ctx.shadowColor = "#ffd166"; ctx.shadowBlur = 18;
    ctx.strokeStyle = "hsl(" + Math.floor((t*200)%360) + ",90%,65%)";
    ctx.lineWidth = 5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(paddle.x, paddle.y - 2, paddle.w/2 + 14, Math.PI, 2*Math.PI); ctx.stroke();
    ctx.restore();
  }
  var pg = ctx.createLinearGradient(0, paddle.y - 6, 0, paddle.y + paddle.h);
  pg.addColorStop(0, "#ff9fb2"); pg.addColorStop(1, "#ff4d6d");
  ctx.fillStyle = pg;
  rr(paddle.x - pw, paddle.y + (paddle.h - ph)/2, pw*2, ph, 10); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.45)";
  rr(paddle.x - pw + 6, paddle.y + (paddle.h - ph)/2 + 3, pw*2 - 12, 5, 3); ctx.fill();
  drawFace(paddle.x + lookX, paddle.y + paddle.h/2, 1.2, "smile");

  // balls: glow + candy trail
  balls.forEach(function (b) {
    for (var ti = 0; ti < b.trail.length; ti++) {
      var tp = b.trail[ti];
      ctx.globalAlpha = 0.10 + 0.05 * ti;
      ctx.fillStyle = frenzy > 0 ? "hsl(" + Math.floor((t*200 + ti*25)%360) + ",90%,65%)" : "#ffd166";
      ctx.beginPath(); ctx.arc(tp.x, tp.y, b.r * (0.35 + 0.08*ti), 0, 6.3); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = "rgba(36,29,78,0.3)";
    ctx.beginPath(); ctx.arc(b.x+2, b.y+3, b.r, 0, 6.3); ctx.fill();
    ctx.save();
    ctx.shadowColor = "rgba(255,209,102,0.9)"; ctx.shadowBlur = 12;
    var bg = ctx.createRadialGradient(b.x-3, b.y-3, 1, b.x, b.y, b.r+1);
    bg.addColorStop(0, "#fff8e6"); bg.addColorStop(0.6, "#ffd166"); bg.addColorStop(1, "#f2a541");
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.3); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = "rgba(242,101,52,0.7)"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r*0.55, b.spin, b.spin + 2.4); ctx.stroke();
  });

  if (state === STATE.PAUSE) {
    ctx.fillStyle = "rgba(36,29,78,0.55)"; ctx.fillRect(-10, -10, W+20, H+20);
    ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.font = "bold 30px sans-serif";
    ctx.fillText("PAUSED", W/2, H/2);
    ctx.font = "15px sans-serif";
    ctx.fillText("Tap to continue", W/2, H/2 + 30);
  }

  // stuck hint
  if (state === STATE.PLAY && balls.some(function(b){ return b.stuck; })) {
    ctx.fillStyle = "rgba(255,240,138," + (0.55 + 0.4*Math.sin(t*4)) + ")";
    ctx.textAlign = "center"; ctx.font = "bold 15px sans-serif";
    ctx.fillText("TAP TO LAUNCH", W/2, paddle.y - 56);
  }

  if (fxFlash > 0) { ctx.globalAlpha = fxFlash; ctx.fillStyle = fxFlashColor; ctx.fillRect(-10,-10,W+20,H+20); ctx.globalAlpha = 1; }
}

canvas.addEventListener("mousedown", function () { if (state === STATE.PAUSE) state = STATE.PLAY; });
canvas.addEventListener("touchstart", function () { if (state === STATE.PAUSE) state = STATE.PLAY; }, { passive: true });

/* ---------------- loop ---------------- */
var last = performance.now();
function frame(now) {
  var dt = Math.min((now - last) / 1000, 0.033);
  last = now;
  var steps = Math.max(1, Math.ceil(dt / (1/240)));
  for(var sub=0;sub<steps;sub++) update(dt/steps);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
