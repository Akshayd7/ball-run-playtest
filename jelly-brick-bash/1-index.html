<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Jelly Brick Bash</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #7ec8f0; font-family: 'Segoe UI','Trebuchet MS',Roboto,Helvetica,Arial,sans-serif; touch-action: none; }
  #game-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: linear-gradient(#5db7ea 0%, #9adcf7 55%, #cdeffb 100%); }
  canvas { display: block; }
</style>
</head>
<body>
<div id="game-container"><canvas id="game"></canvas></div>
<script src="https://bridge.playgama.com/v2/stable/playgama-bridge.js"></script>
<script>
"use strict";
/* JELLY BRICK BASH - original kids cartoon brick-breaker. Single file, no external assets. */
var W = 800, H = 450;
var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");
var DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  var cw = window.innerWidth, ch = window.innerHeight;
  var scale = Math.min(cw / W, ch / H);
  var pw = Math.round(W * scale), ph = Math.round(H * scale);
  canvas.style.width = pw + "px"; canvas.style.height = ph + "px";
  canvas.width = Math.round(W * scale * DPR); canvas.height = Math.round(H * scale * DPR);
}
window.addEventListener("resize", resize); resize();

/* ---------------- audio (all synthesized) ---------------- */
var AC = null, masterGain = null, musicGain = null, sfxGain = null, muted = false;
function audioInit() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = AC.createGain(); masterGain.gain.value = muted ? 0 : 1; masterGain.connect(AC.destination);
    musicGain = AC.createGain(); musicGain.gain.value = 0.34; musicGain.connect(masterGain);
    sfxGain = AC.createGain(); sfxGain.gain.value = 0.55; sfxGain.connect(masterGain);
    startMusic();
  } catch (e) { AC = null; }
}
function setMuted(m) { muted = m; if (masterGain) masterGain.gain.value = m ? 0 : 1; }
function tone(freq, dur, type, vol, when, dest, slide) {
  if (!AC) return;
  var t = AC.currentTime + (when || 0);
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.3, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || sfxGain);
  o.start(t); o.stop(t + dur + 0.05);
}
function sfx(name) {
  if (!AC || muted) return;
  switch (name) {
    case "paddle": tone(240, 0.09, "triangle", 0.5, 0, sfxGain, 120); break;
    case "brick": tone(520, 0.07, "square", 0.22, 0, sfxGain, 80); break;
    case "break": tone(660, 0.1, "square", 0.25); tone(880, 0.12, "square", 0.2, 0.05); break;
    case "power": tone(523, 0.09, "sine", 0.4); tone(659, 0.09, "sine", 0.4, 0.08); tone(784, 0.14, "sine", 0.4, 0.16); break;
    case "lose": tone(320, 0.35, "sawtooth", 0.3, 0, sfxGain, -220); break;
    case "clear": [523,659,784,1047].forEach(function(f,i){ tone(f, 0.16, "triangle", 0.35, i*0.1); }); break;
    case "over": [392,330,262,196].forEach(function(f,i){ tone(f, 0.28, "triangle", 0.35, i*0.18); }); break;
    case "start": tone(523, 0.1, "triangle", 0.4); tone(784, 0.16, "triangle", 0.4, 0.1); break;
    case "wall": tone(180, 0.05, "triangle", 0.18); break;
  }
}
/* tiny cheerful loop: bass + pluck melody */
var musicTimer = null, musicStep = 0;
var MEL = [523,0,659,0,784,0,659,0, 880,0,784,0,659,0,587,0, 523,0,659,0,784,0,880,0, 784,659,587,0,523,0,0,0];
var BAS = [131,131,165,165, 175,175,165,165, 131,131,165,165, 175,165,147,147];
function startMusic() {
  if (!AC || musicTimer) return;
  musicTimer = setInterval(function () {
    if (muted || !AC) return;
    var i = musicStep % MEL.length;
    var m = MEL[i];
    if (m) tone(m, 0.14, "triangle", 0.16, 0, musicGain);
    if (i % 2 === 0) { var b = BAS[(musicStep >> 1) % BAS.length]; tone(b, 0.22, "sine", 0.2, 0, musicGain); }
    musicStep++;
  }, 170);
}

/* ---------------- game state ---------------- */
var STATE = { START: 0, PLAY: 1, CLEAR: 2, OVER: 3, PAUSE: 4 };
var state = STATE.START;
var score = 0, best = 0, lives = 3, level = 1, combo = 0, scoreMult = 1, scoreMultT = 0;
try { best = parseInt(localStorage.getItem("jbb_best") || "0", 10) || 0; } catch (e) {}
function saveBest() { try { localStorage.setItem("jbb_best", String(best)); } catch (e) {} }

var paddle = { x: W/2, y: H-34, w: 96, h: 16, baseW: 96, wobble: 0, wide: 0 };
var balls = [];
var bricks = [];
var powerups = [];
var particles = [];
var floaters = [];
var shake = 0;

var BRICK_COLORS = [
  { top:"#ff8fa3", bot:"#f2567c" },
  { top:"#ffb36b", bot:"#f2852e" },
  { top:"#ffe066", bot:"#f2b53d" },
  { top:"#9be15d", bot:"#5cb838" },
  { top:"#6bd5f2", bot:"#34a7dd" },
  { top:"#c39bf2", bot:"#9161e0" }
];

function levelRows(l) { return Math.min(4 + Math.ceil(l/2), 7); }
function ballSpeed(l) { return Math.min(265 + (l-1)*22, 430); }

function buildLevel(l) {
  bricks = []; powerups = []; particles = []; floaters = [];
  var rows = levelRows(l), cols = 9;
  var bw = 74, bh = 26, gap = 8, ox = (W - (cols*bw + (cols-1)*gap))/2, oy = 64;
  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      if (l >= 3 && ((r*7+c*3+l) % 11 === 0)) continue; // holes in later levels
      var tough = (l >= 2 && ((r+c+l) % 5 === 0)) ? 2 : 1;
      bricks.push({ x: ox + c*(bw+gap), y: oy + r*(bh+gap), w: bw, h: bh, hp: tough, maxhp: tough,
        color: BRICK_COLORS[r % BRICK_COLORS.length], wob: Math.random()*6.28, alive: true });
    }
  }
  var count = 0;
  bricks.forEach(function(b){ if (b.alive) count++; });
  if (count === 0) bricks.push({ x: W/2-37, y: 100, w: 74, h: 26, hp: 1, maxhp: 1, color: BRICK_COLORS[0], wob: 0, alive: true });
}
function resetBall(stuck) {
  balls = [{ x: paddle.x, y: paddle.y - 14, r: 8, vx: 0, vy: 0, stuck: !!stuck, spin: 0 }];
}
function launchBall(b, angJitter) {
  var a = -Math.PI/2 + (Math.random()*0.5 - 0.25) + (angJitter || 0);
  var sp = ballSpeed(level);
  b.vx = Math.cos(a)*sp; b.vy = Math.sin(a)*sp; b.stuck = false;
}
function newGame() {
  score = 0; lives = 3; level = 1; combo = 0; scoreMult = 1; scoreMultT = 0;
  paddle.w = paddle.baseW; paddle.wide = 0;
  buildLevel(level); resetBall(true);
  state = STATE.PLAY; sfx("start");
}
function nextLevel() {
  level++;
  buildLevel(level); resetBall(true);
  state = STATE.PLAY;
}

/* ---------------- input ---------------- */
var pointerX = null, keys = {};
function toGameX(clientX) {
  var r = canvas.getBoundingClientRect();
  return (clientX - r.left) / r.width * W;
}
function onMove(clientX) { pointerX = toGameX(clientX); }
canvas.addEventListener("mousemove", function (e) { onMove(e.clientX); });
canvas.addEventListener("touchmove", function (e) { e.preventDefault(); onMove(e.touches[0].clientX); }, { passive: false });
function onTap(x, y) {
  audioInit();
  if (AC && AC.state === "suspended") AC.resume();
  var gx = toGameX(x), r = canvas.getBoundingClientRect();
  var gy = (y - r.top) / r.height * H;
  // mute button hit (top-right circle)
  var dx = gx - (W-30), dy = gy - 30;
  if (dx*dx + dy*dy <= 20*20) { setMuted(!muted); return; }
  if (state === STATE.START) { newGame(); return; }
  if (state === STATE.OVER || state === STATE.CLEAR) {
    if (state === STATE.OVER) maybeInterstitial(function(){ state = STATE.START; });
    else nextLevel();
    return;
  }
  if (state === STATE.PLAY) {
    balls.forEach(function (b) { if (b.stuck) launchBall(b); });
  }
}
canvas.addEventListener("mousedown", function (e) { onTap(e.clientX, e.clientY); });
canvas.addEventListener("touchstart", function (e) { e.preventDefault(); onTap(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
window.addEventListener("keydown", function (e) {
  keys[e.key] = true;
  if (e.key === " " || e.key === "Enter") {
    audioInit();
    if (state === STATE.START) newGame();
    else if (state === STATE.OVER) maybeInterstitial(function(){ state = STATE.START; });
    else if (state === STATE.CLEAR) nextLevel();
    else balls.forEach(function (b) { if (b.stuck) launchBall(b); });
  }
  if (e.key === "m" || e.key === "M") setMuted(!muted);
});
window.addEventListener("keyup", function (e) { keys[e.key] = false; });
document.addEventListener("visibilitychange", function () {
  if (document.hidden && state === STATE.PLAY) state = STATE.PAUSE;
});

/* ---------------- playgama bridge (graceful fallback) ---------------- */
var bridgeReady = false;
function maybeInterstitial(cb) {
  if (bridgeReady && window.bridge.advertisement && window.bridge.advertisement.isInterstitialSupported) {
    try { window.bridge.advertisement.showInterstitial(); } catch (e) {}
  }
  if (cb) cb();
}
function bridgeInit() {
  if (!window.bridge || typeof window.bridge.initialize !== "function") return;
  window.bridge.initialize().then(function () {
    bridgeReady = true;
    try { window.bridge.platform.sendMessage("game_ready"); } catch (e) {}
    try { setMuted(!window.bridge.platform.isAudioEnabled); } catch (e) {}
    try {
      window.bridge.platform.on(window.bridge.EVENT_NAME.AUDIO_STATE_CHANGED, function (en) { setMuted(!en); });
      window.bridge.platform.on(window.bridge.EVENT_NAME.PAUSE_STATE_CHANGED, function (paused) {
        if (paused && state === STATE.PLAY) state = STATE.PAUSE;
      });
    } catch (e) {}
  }).catch(function () {});
}
bridgeInit();

/* ---------------- update ---------------- */
function addParticles(x, y, color, n) {
  for (var i = 0; i < (n||8); i++) {
    particles.push({ x: x, y: y, vx: (Math.random()-0.5)*260, vy: (Math.random()-0.7)*260,
      life: 0.5 + Math.random()*0.3, t: 0, color: color, r: 2+Math.random()*3 });
  }
}
function spawnFloater(x, y, text, color) {
  floaters.push({ x: x, y: y, text: text, t: 0, color: color || "#fff" });
}
function spawnPowerup(x, y) {
  var kinds = ["W","M","S","L","X"];
  var k = kinds[Math.floor(Math.random()*kinds.length)];
  powerups.push({ x: x, y: y, vy: 95, kind: k, t: 0 });
}
function applyPower(k) {
  sfx("power");
  if (k === "W") { paddle.w = paddle.baseW * 1.6; paddle.wide = 8; spawnFloater(paddle.x, paddle.y-30, "WIDE!", "#9be15d"); }
  else if (k === "M") {
    var src = balls.filter(function(b){ return !b.stuck; })[0] || balls[0];
    if (src && balls.length < 4) {
      [-0.5, 0.5].forEach(function (j) {
        var nb = { x: src.x, y: src.y, r: 8, vx: 0, vy: 0, stuck: false, spin: 0 };
        var sp = Math.hypot(src.vx, src.vy) || ballSpeed(level);
        var a = Math.atan2(src.vy, src.vx) + j;
        nb.vx = Math.cos(a)*sp; nb.vy = Math.sin(a)*sp;
        balls.push(nb);
      });
      spawnFloater(src.x, src.y-20, "MULTI!", "#6bd5f2");
    }
  }
  else if (k === "S") { balls.forEach(function(b){ if (!b.stuck) { b.vx *= 0.7; b.vy *= 0.7; } }); spawnFloater(W/2, H/2, "SLOW!", "#ffe066"); }
  else if (k === "L") { lives = Math.min(lives+1, 5); spawnFloater(W/2, H/2, "+1 LIFE!", "#ff8fa3"); }
  else if (k === "X") { scoreMult = 2; scoreMultT = 10; spawnFloater(W/2, H/2, "SCORE x2!", "#c39bf2"); }
}

var clearTimer = 0;
function update(dt) {
  // background clouds always drift
  clouds.forEach(function (c) { c.x += c.v * dt; if (c.x > W + 90) c.x = -90; });
  if (state === STATE.PAUSE) return;
  if (state !== STATE.PLAY) return;

  // paddle control
  var spd = 520 * dt;
  if (keys["ArrowLeft"] || keys["a"] || keys["A"]) paddle.x -= spd;
  if (keys["ArrowRight"] || keys["d"] || keys["D"]) paddle.x += spd;
  if (pointerX !== null) paddle.x += (pointerX - paddle.x) * Math.min(1, dt*16);
  paddle.x = Math.max(paddle.w/2 + 6, Math.min(W - paddle.w/2 - 6, paddle.x));
  if (paddle.wide > 0) { paddle.wide -= dt; if (paddle.wide <= 0) paddle.w = paddle.baseW; }
  if (scoreMultT > 0) { scoreMultT -= dt; if (scoreMultT <= 0) scoreMult = 1; }

  var aliveBricks = 0;
  bricks.forEach(function (b) { if (b.alive) aliveBricks++; });

  for (var bi = balls.length - 1; bi >= 0; bi--) {
    var b = balls[bi];
    if (b.stuck) { b.x = paddle.x; b.y = paddle.y - 14; continue; }
    b.x += b.vx * dt; b.y += b.vy * dt; b.spin += dt * 6;

    if (b.x < 8 + b.r) { b.x = 8 + b.r; b.vx = Math.abs(b.vx); sfx("wall"); }
    if (b.x > W - 8 - b.r) { b.x = W - 8 - b.r; b.vx = -Math.abs(b.vx); sfx("wall"); }
    if (b.y < 8 + b.r) { b.y = 8 + b.r; b.vy = Math.abs(b.vy); sfx("wall"); }

    // paddle bounce
    if (b.vy > 0 && b.y + b.r >= paddle.y && b.y - b.r <= paddle.y + paddle.h &&
        b.x >= paddle.x - paddle.w/2 - 4 && b.x <= paddle.x + paddle.w/2 + 4) {
      var rel = (b.x - paddle.x) / (paddle.w/2 + 4);
      rel = Math.max(-1, Math.min(1, rel));
      var sp = Math.min(Math.hypot(b.vx, b.vy) * 1.012, ballSpeed(level) * 1.35);
      var ang = -Math.PI/2 + rel * 1.05;
      b.vx = Math.cos(ang) * sp; b.vy = Math.sin(ang) * sp;
      b.y = paddle.y - b.r - 1;
      combo = 0; paddle.wobble = 1;
      sfx("paddle");
    }

    // bricks
    for (var i = 0; i < bricks.length; i++) {
      var br = bricks[i];
      if (!br.alive) continue;
      if (b.x + b.r > br.x && b.x - b.r < br.x + br.w && b.y + b.r > br.y && b.y - b.r < br.y + br.h) {
        var overlapL = (b.x + b.r) - br.x, overlapR = (br.x + br.w) - (b.x - b.r);
        var overlapT = (b.y + b.r) - br.y, overlapB = (br.y + br.h) - (b.y - b.r);
        var minX = Math.min(overlapL, overlapR), minY = Math.min(overlapT, overlapB);
        if (minX < minY) b.vx = (overlapL < overlapR) ? -Math.abs(b.vx) : Math.abs(b.vx);
        else b.vy = (overlapT < overlapB) ? -Math.abs(b.vy) : Math.abs(b.vy);
        br.hp--; combo++;
        if (br.hp <= 0) {
          br.alive = false;
          var pts = 10 * scoreMult * (1 + Math.floor(combo/8));
          score += pts;
          addParticles(br.x + br.w/2, br.y + br.h/2, br.color.top, 10);
          spawnFloater(br.x + br.w/2, br.y, "+" + pts, "#ffffff");
          if (Math.random() < 0.16) spawnPowerup(br.x + br.w/2, br.y + br.h/2);
          sfx("break"); shake = Math.min(shake + 2.5, 6);
        } else {
          addParticles(b.x, b.y, "#ffffff", 3);
          sfx("brick");
        }
        break;
      }
    }

    // fell below
    if (b.y - b.r > H + 20) {
      balls.splice(bi, 1);
    }
  }

  // powerups fall
  for (var pi = powerups.length - 1; pi >= 0; pi--) {
    var p = powerups[pi];
    p.y += p.vy * dt; p.t += dt;
    if (p.y > paddle.y - 4 && p.y < paddle.y + paddle.h + 10 && Math.abs(p.x - paddle.x) < paddle.w/2 + 12) {
      applyPower(p.kind); powerups.splice(pi, 1); continue;
    }
    if (p.y > H + 20) powerups.splice(pi, 1);
  }

  // particles / floaters
  for (var qi = particles.length - 1; qi >= 0; qi--) {
    var q = particles[qi]; q.t += dt; q.x += q.vx*dt; q.y += q.vy*dt; q.vy += 500*dt;
    if (q.t > q.life) particles.splice(qi, 1);
  }
  for (var fi = floaters.length - 1; fi >= 0; fi--) {
    var f = floaters[fi]; f.t += dt; f.y -= 34*dt;
    if (f.t > 1) floaters.splice(fi, 1);
  }
  if (shake > 0) shake = Math.max(0, shake - dt*14);
  if (paddle.wobble > 0) paddle.wobble = Math.max(0, paddle.wobble - dt*4);

  // ball lost
  if (balls.length === 0) {
    lives--; combo = 0; sfx("lose");
    if (lives <= 0) {
      if (score > best) { best = score; saveBest(); }
      state = STATE.OVER; sfx("over");
    } else {
      resetBall(true);
    }
  }

  // level clear
  var remain = 0;
  bricks.forEach(function (bb) { if (bb.alive) remain++; });
  if (remain === 0 && state === STATE.PLAY) {
    var bonus = 50 * level;
    score += bonus;
    if (score > best) { best = score; saveBest(); }
    state = STATE.CLEAR; sfx("clear");
    if (bridgeReady && level % 2 === 0) maybeInterstitial(null);
  }
}

/* ---------------- drawing ---------------- */
var clouds = [];
for (var ci = 0; ci < 5; ci++) clouds.push({ x: Math.random()*W, y: 26 + Math.random()*110, s: 0.6+Math.random()*0.8, v: 6+Math.random()*8 });

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
function drawCloud(c) {
  ctx.fillStyle = "rgba(255,255,255,0.92)";
  ctx.beginPath();
  ctx.arc(c.x, c.y, 16*c.s, 0, 6.3);
  ctx.arc(c.x+18*c.s, c.y-8*c.s, 13*c.s, 0, 6.3);
  ctx.arc(c.x+36*c.s, c.y, 15*c.s, 0, 6.3);
  ctx.arc(c.x+18*c.s, c.y+6*c.s, 14*c.s, 0, 6.3);
  ctx.fill();
}
function drawFace(cx, cy, s, mood) {
  // eyes
  ctx.fillStyle = "#2b2440";
  ctx.beginPath(); ctx.arc(cx-5*s, cy-2*s, 2.4*s, 0, 6.3); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+5*s, cy-2*s, 2.4*s, 0, 6.3); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(cx-4.4*s, cy-2.8*s, 0.9*s, 0, 6.3); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+5.6*s, cy-2.8*s, 0.9*s, 0, 6.3); ctx.fill();
  // mouth
  ctx.strokeStyle = "#2b2440"; ctx.lineWidth = 1.6*s; ctx.lineCap = "round";
  ctx.beginPath();
  if (mood === "hurt") ctx.arc(cx, cy+6*s, 3.4*s, Math.PI*1.15, Math.PI*1.85, false);
  else ctx.arc(cx, cy+1.5*s, 4*s, Math.PI*0.15, Math.PI*0.85, false);
  ctx.stroke();
}
function drawHeart(x, y, s, on) {
  ctx.fillStyle = on ? "#f2567c" : "rgba(43,36,64,0.18)";
  ctx.beginPath();
  ctx.moveTo(x, y+3*s);
  ctx.bezierCurveTo(x-4*s, y-1.5*s, x-2.2*s, y-4.5*s, x, y-2.2*s);
  ctx.bezierCurveTo(x+2.2*s, y-4.5*s, x+4*s, y-1.5*s, x, y+3*s);
  ctx.fill();
}
function drawMute() {
  var cx = W-30, cy = 30;
  ctx.fillStyle = "rgba(43,36,64,0.55)";
  ctx.beginPath(); ctx.arc(cx, cy, 17, 0, 6.3); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.moveTo(cx-7, cy-3); ctx.lineTo(cx-3, cy-3); ctx.lineTo(cx+2, cy-8); ctx.lineTo(cx+2, cy+8); ctx.lineTo(cx-3, cy+3); ctx.lineTo(cx-7, cy+3);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.lineCap = "round";
  if (muted) {
    ctx.beginPath(); ctx.moveTo(cx+5, cy-5); ctx.lineTo(cx+11, cy+5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+11, cy-5); ctx.lineTo(cx+5, cy+5); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(cx+5, cy, 5, -1.1, 1.1); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx+5, cy, 8.5, -1.0, 1.0); ctx.stroke();
  }
}
function drawBrick(b, t) {
  var wob = Math.sin(t*3 + b.wob) * 1.2;
  var g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
  g.addColorStop(0, b.color.top); g.addColorStop(1, b.color.bot);
  ctx.fillStyle = "rgba(43,36,64,0.18)";
  rr(b.x+2, b.y+3 + wob*0.3, b.w, b.h, 9); ctx.fill();
  ctx.fillStyle = g;
  rr(b.x, b.y + wob*0.3, b.w, b.h, 9); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  rr(b.x+5, b.y+3 + wob*0.3, b.w-10, 7, 4); ctx.fill();
  if (b.hp < b.maxhp) { // cracked
    ctx.strokeStyle = "rgba(43,36,64,0.5)"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(b.x+b.w*0.3, b.y+2); ctx.lineTo(b.x+b.w*0.45, b.y+b.h*0.5); ctx.lineTo(b.x+b.w*0.35, b.y+b.h-2); ctx.stroke();
  }
  drawFace(b.x + b.w/2, b.y + b.h/2 + wob*0.3, 1.15, b.hp < b.maxhp ? "hurt" : "smile");
}
var POW_STYLE = { W:{c:"#9be15d",l:"W"}, M:{c:"#6bd5f2",l:"x3"}, S:{c:"#ffe066",l:"S"}, L:{c:"#ff8fa3",l:"+1"}, X:{c:"#c39bf2",l:"2x"} };
function drawPower(p, t) {
  var st = POW_STYLE[p.kind];
  var bob = Math.sin(t*5 + p.t) * 2;
  ctx.fillStyle = "rgba(43,36,64,0.25)";
  ctx.beginPath(); ctx.arc(p.x+1.5, p.y+2.5+bob, 13, 0, 6.3); ctx.fill();
  ctx.fillStyle = st.c;
  ctx.beginPath(); ctx.arc(p.x, p.y+bob, 13, 0, 6.3); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  ctx.beginPath(); ctx.arc(p.x-4, p.y-4+bob, 4, 0, 6.3); ctx.fill();
  ctx.fillStyle = "#2b2440";
  ctx.font = "bold " + (p.kind==="M"||p.kind==="L"||p.kind==="X" ? 11 : 13) + "px sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(st.l, p.x, p.y + 1 + bob);
}
function draw() {
  var t = performance.now()/1000;
  var scale = canvas.width / W;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

  // sky
  var sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#5db7ea"); sky.addColorStop(0.55, "#9adcf7"); sky.addColorStop(1, "#d8f4fd");
  ctx.fillStyle = sky; ctx.fillRect(-10, -10, W+20, H+20);
  // sun
  ctx.fillStyle = "#fff3b0";
  ctx.beginPath(); ctx.arc(70, 66, 26, 0, 6.3); ctx.fill();
  ctx.fillStyle = "rgba(255,243,176,0.4)";
  ctx.beginPath(); ctx.arc(70, 66, 36, 0, 6.3); ctx.fill();
  clouds.forEach(drawCloud);
  // hills
  ctx.fillStyle = "#8fd694";
  ctx.beginPath(); ctx.ellipse(140, H+40, 260, 90, 0, 0, 6.3); ctx.fill();
  ctx.fillStyle = "#79c77f";
  ctx.beginPath(); ctx.ellipse(620, H+50, 300, 100, 0, 0, 6.3); ctx.fill();

  // HUD
  ctx.fillStyle = "rgba(43,36,64,0.55)";
  rr(10, 10, 150, 44, 10); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.font = "bold 17px sans-serif";
  ctx.fillText("SCORE " + score, 20, 30);
  ctx.font = "12px sans-serif";
  ctx.fillStyle = "#cdeffb";
  ctx.fillText("BEST " + best, 20, 46);
  // level chip
  ctx.fillStyle = "rgba(43,36,64,0.55)";
  rr(W/2 - 52, 10, 104, 26, 13); ctx.fill();
  ctx.fillStyle = "#ffe066"; ctx.textAlign = "center"; ctx.font = "bold 14px sans-serif";
  ctx.fillText("LEVEL " + level, W/2, 28);
  if (scoreMult > 1) {
    ctx.fillStyle = "#c39bf2"; ctx.font = "bold 12px sans-serif";
    ctx.fillText("x2 " + Math.ceil(scoreMultT) + "s", W/2, 48);
  }
  // lives
  for (var li = 0; li < lives; li++) drawHeart(W - 70 - li*20, 56, 4.2, true);
  drawMute();

  if (state === STATE.START || state === STATE.OVER) {
    // dim
    ctx.fillStyle = "rgba(43,36,64,0.45)"; ctx.fillRect(-10, -10, W+20, H+20);
    ctx.textAlign = "center";
    ctx.fillStyle = "#fff";
    ctx.font = "bold 44px sans-serif";
    ctx.fillText("JELLY BRICK BASH", W/2, H/2 - 70);
    ctx.font = "16px sans-serif"; ctx.fillStyle = "#cdeffb";
    if (state === STATE.START) {
      ctx.fillText("Smash every jelly brick with your candy ball!", W/2, H/2 - 36);
      ctx.fillText("Move: mouse / finger / arrow keys", W/2, H/2 - 12);
      // big jelly mascot
      var my = H/2 + 52;
      ctx.fillStyle = "#f2567c";
      rr(W/2-34, my-26, 68, 52, 16); ctx.fill();
      ctx.fillStyle = "#ff8fa3";
      rr(W/2-34, my-26, 68, 20, 16); ctx.fill();
      drawFace(W/2, my, 2.2, "smile");
      ctx.fillStyle = "#ffe066"; ctx.font = "bold 22px sans-serif";
      ctx.fillText("TAP TO START", W/2, H - 46);
    } else {
      ctx.fillStyle = "#ffe066"; ctx.font = "bold 40px sans-serif";
      ctx.fillText("GAME OVER", W/2, H/2 - 28);
      ctx.fillStyle = "#fff"; ctx.font = "bold 22px sans-serif";
      ctx.fillText("SCORE " + score, W/2, H/2 + 8);
      ctx.font = "16px sans-serif";
      ctx.fillText("BEST " + best + (score >= best && score > 0 ? "  NEW BEST!" : ""), W/2, H/2 + 34);
      ctx.fillStyle = "#ffe066"; ctx.font = "bold 20px sans-serif";
      ctx.fillText("TAP TO RETRY", W/2, H - 52);
    }
    return;
  }

  if (state === STATE.CLEAR) {
    ctx.fillStyle = "rgba(43,36,64,0.4)"; ctx.fillRect(-10, -10, W+20, H+20);
    ctx.textAlign = "center";
    ctx.fillStyle = "#9be15d"; ctx.font = "bold 40px sans-serif";
    ctx.fillText("LEVEL " + level + " CLEAR!", W/2, H/2 - 20);
    ctx.fillStyle = "#fff"; ctx.font = "18px sans-serif";
    ctx.fillText("Bonus +" + (50*level) + "  -  Score " + score, W/2, H/2 + 14);
    ctx.fillStyle = "#ffe066"; ctx.font = "bold 20px sans-serif";
    ctx.fillText("TAP FOR LEVEL " + (level+1), W/2, H/2 + 52);
    return;
  }

  // bricks
  bricks.forEach(function (b) { if (b.alive) drawBrick(b, t); });
  // powerups
  powerups.forEach(function (p) { drawPower(p, t); });
  // particles
  particles.forEach(function (p) {
    ctx.globalAlpha = 1 - p.t / p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.3); ctx.fill();
  });
  ctx.globalAlpha = 1;
  // floaters
  floaters.forEach(function (f) {
    ctx.globalAlpha = 1 - f.t;
    ctx.fillStyle = f.color; ctx.font = "bold 15px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(f.text, f.x, f.y);
  });
  ctx.globalAlpha = 1;

  // paddle (jelly)
  var squish = 1 + paddle.wobble * 0.18 * Math.sin(t*30);
  var pw = paddle.w * (2 - squish) * 0.5, ph = paddle.h * squish;
  ctx.fillStyle = "rgba(43,36,64,0.2)";
  rr(paddle.x - paddle.w/2 + 3, paddle.y + 5, paddle.w, paddle.h, 10); ctx.fill();
  var pg = ctx.createLinearGradient(0, paddle.y - 6, 0, paddle.y + paddle.h);
  pg.addColorStop(0, "#ff8fa3"); pg.addColorStop(1, "#f2567c");
  ctx.fillStyle = pg;
  rr(paddle.x - pw, paddle.y + (paddle.h - ph)/2, pw*2, ph, 10); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.4)";
  rr(paddle.x - pw + 6, paddle.y + (paddle.h - ph)/2 + 3, pw*2 - 12, 5, 3); ctx.fill();
  drawFace(paddle.x, paddle.y + paddle.h/2, 1.2, "smile");

  // balls
  balls.forEach(function (b) {
    ctx.fillStyle = "rgba(43,36,64,0.2)";
    ctx.beginPath(); ctx.arc(b.x+2, b.y+3, b.r, 0, 6.3); ctx.fill();
    var bg = ctx.createRadialGradient(b.x-3, b.y-3, 1, b.x, b.y, b.r+1);
    bg.addColorStop(0, "#fff8e6"); bg.addColorStop(0.6, "#ffd166"); bg.addColorStop(1, "#f2a541");
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.3); ctx.fill();
    // swirl
    ctx.strokeStyle = "rgba(242,101,52,0.7)"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r*0.55, b.spin, b.spin + 2.4); ctx.stroke();
  });

  if (state === STATE.PAUSE) {
    ctx.fillStyle = "rgba(43,36,64,0.5)"; ctx.fillRect(-10, -10, W+20, H+20);
    ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.font = "bold 30px sans-serif";
    ctx.fillText("PAUSED", W/2, H/2);
    ctx.font = "15px sans-serif";
    ctx.fillText("Tap to continue", W/2, H/2 + 30);
  }

  // stuck hint
  if (state === STATE.PLAY && balls.some(function(b){ return b.stuck; })) {
    ctx.fillStyle = "rgba(255,255,255," + (0.55 + 0.4*Math.sin(t*4)) + ")";
    ctx.textAlign = "center"; ctx.font = "bold 15px sans-serif";
    ctx.fillText("TAP TO LAUNCH", W/2, H - 70);
  }
}

canvas.addEventListener("mousedown", function () { if (state === STATE.PAUSE) state = STATE.PLAY; });
canvas.addEventListener("touchstart", function () { if (state === STATE.PAUSE) state = STATE.PLAY; }, { passive: true });

/* ---------------- loop ---------------- */
var last = performance.now();
function frame(now) {
  var dt = Math.min((now - last) / 1000, 0.033);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
